<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASO Revise</title>
<meta name="description" content="Endless GA and Current Affairs questions for the OPSC ASO exam. Every second question is new; missed ones come back within 20.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
/* White-and-blue reference-manual look, light mode only. */
:root{
  --bg:#fbfbfb; --paper:#ffffff; --fg:#111111; --muted:#6e6e73; --faint:#a9a9ae; --rule:#d7d7da; --grid:#eef0f6;
  --blue:#2b4cff; --blue-soft:#e0e6ff; --warn:#b4410b;
  --f-serif:"EB Garamond","Iowan Old Style",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-pixel:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:19px/1.6 var(--f-serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
a{color:var(--fg);text-decoration:underline dotted;text-decoration-color:var(--blue);text-underline-offset:3px}

html{scrollbar-gutter:stable}
.page{max-width:760px;margin:0 auto;padding:24px 16px 40px}
.mono{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
.util{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.util a{color:var(--muted)}
.head{display:grid;gap:0}
h1{font-family:var(--f-pixel);font-weight:400;color:var(--blue);font-size:clamp(2.2rem,8vw,3rem);line-height:1;margin:18px 0 0;letter-spacing:.02em}
.sub{font-size:1rem;color:var(--muted);margin:8px 0 0;max-width:60ch}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--fg);border-bottom:1px solid var(--rule)}
.stats div{padding:8px 8px 8px 0;min-width:0}
.stats .k{font-size:10px;color:var(--muted)}
.stats .v{font-family:var(--f-pixel);color:var(--blue);font-size:clamp(1rem,4.6vw,1.4rem);line-height:1.2;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--grid);margin-top:-1px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}

.main{margin-top:22px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11px;min-height:46px;align-content:flex-start}
.src{color:var(--blue);flex-basis:100%}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border:1px solid currentColor;line-height:1.7}
.tag.new{color:var(--muted);border-style:dashed}
.tag.rev{color:var(--blue)}
.tag.miss{color:var(--warn)}
.tag.chk{color:var(--warn);border-style:dashed}
.q{font-size:clamp(1.4rem,4.4vw,1.7rem);font-weight:500;line-height:1.3;margin:12px 0 18px;overflow-wrap:anywhere;white-space:pre-line;min-height:3.9em}

.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:baseline;width:100%;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:12px 16px;cursor:pointer;font-size:1.12rem;line-height:1.35;min-height:52px;}
.opt:hover:not([disabled]){background:var(--grid)}
.opt:focus-visible{outline:2px solid var(--blue);outline-offset:-4px;background:var(--grid)}
.opt .l{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt[disabled]{cursor:default}
/* same border width in every state, so nothing shifts by a pixel */
.opt.right{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-soft)}
.opt.right .l{color:var(--blue)}
.opt.wrong{border-color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn);color:var(--warn)}
.opt.wrong .l{color:var(--warn)}
.opt.dim{color:var(--faint)}
.opt.dim .l{color:var(--faint)}

.unsure{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.unsure.gone{visibility:hidden}
.btn{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--fg);background:var(--paper);border-radius:3px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.on,.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn[disabled]{background:var(--paper);border-color:var(--rule);color:var(--faint);cursor:default}
.hint{font-size:10px;color:var(--faint)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.recall{display:grid;gap:12px;justify-items:start;margin-top:8px}
.btn.big{padding:14px 22px;font-size:13px}
.grade{display:flex;gap:10px;flex-wrap:wrap}
.grade .btn{padding:14px 20px;font-size:13px}
.btn.sm{font-size:10.5px;padding:5px 10px;min-width:0}
.util{align-items:center}

/* the answer panel: always there, same place, filled after you answer */
.side{margin-top:22px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--paper);border:1px dashed var(--rule);padding:16px 18px;min-height:150px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.panel.miss{border:1px solid var(--warn);background:var(--paper)}
.panel.ok{border:1px solid var(--blue);background:var(--paper)}
.panel .lab{font-size:10px;color:var(--faint)}
.panel .idle{color:var(--muted);font-size:1rem;margin-top:8px}
.panel .good{color:var(--blue);font-size:1.2rem;font-weight:500;margin-top:6px}
.panel .h{font-weight:500;font-size:1.15rem;margin-top:6px}
.panel .x{margin-top:8px;line-height:1.5}
.panel .w{margin-top:10px;font-size:10px;color:var(--muted)}
.panel .act{margin-top:12px}
.keys{font-size:10px;color:var(--faint);margin-top:12px;line-height:1.9}
.next{width:100%;padding:14px}
.note{margin-top:30px;color:var(--muted);font-size:1rem}

/* computer screens (also inside the hub, where the sidebar takes ~240px):
   one fixed screen, question left, answer panel right, never a page scroll bar */
@media (min-width:640px){
  html,body{height:100%;overflow:hidden}
  html{scrollbar-gutter:auto}
  .page{max-width:1240px;height:100vh;height:100dvh;padding:clamp(12px,2.6vh,22px) clamp(20px,3vw,40px) clamp(12px,2.6vh,24px);display:flex;flex-direction:column}
  .head{grid-template-columns:auto minmax(0,520px);align-items:end;column-gap:clamp(20px,3vw,40px);justify-content:space-between}
  .head .util{grid-column:1/-1}
  h1{font-size:clamp(1.8rem,5.5vh,3rem);margin-top:clamp(8px,2vh,18px)}
  .sub{grid-column:1}
  .meter{grid-column:2;grid-row:2/4;align-self:end}
  .stats{margin-top:0}
  .stats .v{font-size:clamp(1rem,3vh,1.4rem)}
  .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(20px,3.4vw,44px);margin-top:clamp(12px,3vh,26px)}
  .card{min-height:0;overflow:hidden}
  .meta{min-height:0}
  .q{font-size:clamp(1.15rem,3.6vh,1.7rem);margin:clamp(6px,1.4vh,12px) 0 clamp(10px,2.2vh,18px)}
  .opts{gap:clamp(6px,1.2vh,10px)}
  .opt{padding:clamp(7px,1.5vh,12px) 14px;min-height:clamp(40px,6.4vh,52px);font-size:clamp(1rem,2.5vh,1.12rem)}
  .unsure{margin-top:clamp(8px,1.8vh,14px)}
  .side{margin-top:0;min-height:0}
  .panel{flex:1;min-height:0;overflow:hidden}
}
@media (min-width:640px) and (max-height:760px){ .sub{display:none} }
@media (min-width:640px) and (max-width:1000px){ .sub{display:none} .head{grid-template-columns:auto minmax(0,1fr)} }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="util mono"><a href="./" target="_top">&larr; ASO Hub</a>
      <span class="ctl"><button class="btn sm" id="mode" type="button" aria-pressed="false" aria-keyshortcuts="R">Algo on</button><button class="btn sm" id="mcq" type="button" aria-pressed="false" aria-keyshortcuts="M">MCQ</button><button class="btn sm" id="reveal" type="button" aria-pressed="false" aria-keyshortcuts="S">Answers hidden</button><button class="btn sm" id="reset" type="button">Reset ranking</button></span></div>
    <h1>Revise</h1>
    <p class="sub">Endless four-option questions. Every second one is new. A question you miss comes back within the next 20.</p>
    <div class="meter">
    <div class="stats mono" id="stats">
      <div><div class="k">New</div><div class="v" id="sNew">–</div></div>
      <div><div class="k">Weak</div><div class="v" id="sWeak">–</div></div>
      <div><div class="k">Learning</div><div class="v" id="sLearn">–</div></div>
      <div><div class="k">Strong</div><div class="v" id="sStrong">–</div></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    </div>
  </div>

  <div class="main">
    <div class="card" id="card"><p class="note">Loading questions…</p></div>
    <div class="side">
      <div class="panel" id="after" aria-live="polite"></div>
      <button class="btn primary next" id="next" type="button" disabled>Next question <span aria-hidden="true">· Enter</span></button>
    </div>
  </div>
</div>

<script>
/* Same engine as the ASO Cards iPhone app (Model/Drill.swift).
   Time is counted in answered questions (the clock); every hour away adds 30.
   Odd turns: a NEW question. Even turns: a REVIEW (if none is due, another new one).
   Each answer gives a window in which the question must come back:
     missed or "not sure": 5–20 · then 15–50 · 40–120 · 100–300 · strong 250–600.
   Review order: missed past deadline → missed in window (most-missed first) →
   others past deadline (lowest level first) → others in window → new → longest unseen.
   Progress stays in this browser (localStorage). */
var WINDOWS=[[5,20],[15,50],[40,120],[100,300],[250,600]], STRONG=4, PER_HOUR=30, MAX_AWAY=400, RECENT=3;
var KEY="aso-revise-v2";
var CH={"ga-polity":"Polity","ga-governance":"Governance and Civil Services","ga-economy":"Economy and Planning",
 "ga-history":"Modern History","ga-worldgeo":"World Physical Geography","ga-indiageo":"Physical Geography of India",
 "ga-odisha":"Odisha","ga-environment":"Environment and Ecology","ga-science":"Science and Technology",
 "ga-defence":"Defence","ga-institutions":"Institutions","ga-current":"Current Affairs",
 "ca-defence":"Defence news","ca-days":"Days and themes","ca-economy":"Budget and economy","ca-polity":"Polity in the news",
 "ca-odisha":"Odisha in the news","ca-summits":"Summits","ca-world":"World news","ca-reports":"Reports and indices",
 "ca-space":"Space and science prizes","ca-env":"Environment and heritage","ca-awards":"Awards","ca-sports":"Sports"};
var GUIDE={ga:"ASO-GA-Reference-Manual.html",ca:"ASO-Current-Affairs-2026-Manual.html"};

var bank=[], S=load(), cur=null, kind=null, order=[], unsure=false, locked=false, timer=null;

function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.stats) return s}catch(e){}
  return {clock:0,lastActive:0,stats:{},recent:[],answered:0,correct:0};
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} }
function now(){
  if(!S.lastActive) return S.clock;
  var h=(Date.now()-S.lastActive)/3600000;
  return h>0.25 ? S.clock+Math.min(h*PER_HOUR,MAX_AWAY) : S.clock;
}
function rand(a){ return a[Math.floor(Math.random()*a.length)] }
function minBy(a,less){ var b=null; a.forEach(function(x){ if(b===null||less(x,b)) b=x }); return b }

var RKEY="aso-revise-random", rnd=false, rndRecent=[];
try{ rnd=localStorage.getItem(RKEY)==="1" }catch(e){}
function next(){
  if(rnd){  /* algo off: plain random, no ranking */
    var pool=bank.filter(function(q){return rndRecent.indexOf(q.id)<0});
    return [rand(pool.length?pool:bank),"random"];
  }
  var clock=now(), recent={}; S.recent.forEach(function(id){recent[id]=1});
  var fresh=[],ow=[],oo=[],dw=[],dor=[],seen=[];
  bank.forEach(function(q){
    if(recent[q.id]) return;
    var st=S.stats[q.id];
    if(!st){fresh.push(q);return}
    var e={q:q,s:st}; seen.push(e);
    if(st.deadline<=clock) (st.level===0?ow:oo).push(e);
    else if(st.start<=clock) (st.level===0?dw:dor).push(e);
  });
  if(S.answered%2===0&&fresh.length) return [rand(fresh),"new"];
  var p=minBy(ow,function(a,b){return a.s.deadline<b.s.deadline})
     ||minBy(dw,function(a,b){return a.s.wrong>b.s.wrong||(a.s.wrong===b.s.wrong&&a.s.start<b.s.start)})
     ||minBy(oo,function(a,b){return a.s.level<b.s.level||(a.s.level===b.s.level&&a.s.deadline<b.s.deadline)})
     ||minBy(dor,function(a,b){return a.s.level<b.s.level||(a.s.level===b.s.level&&a.s.start<b.s.start)});
  if(p) return [p.q,"review"];
  if(fresh.length) return [rand(fresh),"new"];
  p=minBy(seen,function(a,b){return a.s.last-a.s.wrong*20<b.s.last-b.s.wrong*20});
  return p?[p.q,"review"]:[rand(bank),"new"];
}

function answer(id,g){
  if(rnd){ rndRecent.push(id); if(rndRecent.length>20) rndRecent=rndRecent.slice(-20); return }
  S.clock=now()+1; S.lastActive=Date.now();
  var isNew=!S.stats[id], st=S.stats[id]||{level:0,last:0,start:0,deadline:0,right:0,wrong:0};
  if(g==="right"){ st.level=isNew?1:Math.min(st.level+1,STRONG); st.right++ }
  else if(g==="unsure"){ st.right++ }
  else { st.level=0; st.wrong++ }
  var w=WINDOWS[g==="right"?st.level:0];
  st.last=S.clock; st.start=S.clock+w[0]; st.deadline=S.clock+w[1];
  S.stats[id]=st; S.recent.push(id); if(S.recent.length>RECENT) S.recent=S.recent.slice(-RECENT);
  S.answered++; if(g!=="wrong") S.correct++;
  save();
}

/* ===== screen ===== */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(id){return document.getElementById(id)}
function stats(){
  var n=0,w=0,l=0,s=0;
  bank.forEach(function(q){var st=S.stats[q.id]; if(!st)n++; else if(st.level===0)w++; else if(st.level>=STRONG)s++; else l++});
  $("sNew").textContent=n; $("sWeak").textContent=w; $("sLearn").textContent=l; $("sStrong").textContent=s;
  $("bar").style.width=(bank.length?s/bank.length*100:0)+"%";
}
/* ===== view settings (saved in this browser) =====
   rnd    = algo off: random questions, ranking untouched (← → step back and forward)
   mcq    = show the four options; off = question only, think of the answer, then reveal
   reveal = show the answer straight away (reading mode, never ranked) */
function getFlag(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v==="1" }catch(e){ return d } }
function setFlag(k,v){ try{ localStorage.setItem(k,v?"1":"0") }catch(e){} }
var mcq=getFlag("aso-revise-mcq",true), reveal=getFlag("aso-revise-show",false);
var hist=[], hpos=-1, phase="ask";   // phase: ask → (revealed: non-MCQ, waiting for Knew/Missed) → done
function shuffled(){ var o=[0,1,2,3]; for(var i=3;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=o[i];o[i]=o[j];o[j]=t} return o }

function show(dir){
  clearTimeout(timer);
  var e;
  if(rnd&&dir==="back"){ if(hpos<=0) return; e=hist[--hpos] }
  else if(rnd&&hpos<hist.length-1){ e=hist[++hpos] }
  else {
    var r=next(); e={q:r[0],kind:r[1],order:shuffled()};
    if(rnd){ hist.push(e); if(hist.length>300){ hist.shift() } hpos=hist.length-1 }
  }
  render(e);
}
function render(e){
  clearTimeout(timer);
  cur=e.q; kind=e.kind; order=e.order; unsure=false; phase="ask"; locked=false;
  var st=S.stats[cur.id], book=cur.ch.slice(0,2)==="ca"?"ca":"ga";
  var tags=kind==="random"?'<span class="tag new">Random'+(hist.length?' · '+(hpos+1)+' of '+hist.length:'')+'</span>':kind==="new"?'<span class="tag new">New</span>'
    :(st&&st.wrong?'<span class="tag miss">Review · missed '+st.wrong+'×</span>':'<span class="tag rev">Review</span>');
  if(cur.pyq) tags+='<span class="tag rev">PYQ '+esc(cur.pyq)+'</span>';
  if(cur.check) tags+='<span class="tag chk">Check</span>';
  var h='<div class="meta mono"><span class="src">'+(book==="ca"?"News · ":"GA · ")+esc(CH[cur.ch]||cur.ch)+'</span>'+tags+'</div>'+
        '<h2 class="q" id="qtext">'+esc(cur.q)+'</h2>';
  if(mcq){
    h+='<div class="opts" id="opts" role="group" aria-labelledby="qtext">';
    order.forEach(function(idx,pos){
      h+='<button class="opt" type="button" data-pos="'+pos+'" aria-keyshortcuts="'+(pos+1)+' '+"ABCD"[pos]+'"><span class="l mono">'+"ABCD"[pos]+'</span><span class="t">'+esc(cur.o[idx])+'</span></button>';
    });
    h+='</div><div class="unsure'+(reveal?' gone':'')+'" id="unsureRow"><button class="btn" id="unsure" type="button" aria-pressed="false" aria-keyshortcuts="U">Not sure</button>'+
       '<span class="hint mono">Tap before answering if you\'re guessing</span></div>';
  } else {
    h+='<div class="recall" id="recall"></div>';
  }
  $("card").innerHTML=h;
  opts().forEach(function(b){ b.onclick=function(){pick(+b.dataset.pos)} });
  if($("unsure")) $("unsure").onclick=toggleUnsure;
  stats();
  if(reveal){ showAnswer(true); return }
  idle();
  if(!mcq){
    $("recall").innerHTML='<button class="btn primary big" id="showAns" type="button">Show answer <span aria-hidden="true">· Space</span></button>'+
      '<p class="hint mono">Say the answer in your head first.</p>';
    $("showAns").onclick=function(){ showAnswer(false) };
    if(kbd) $("showAns").focus({preventScroll:true});
  } else if(kbd) focusOpt(0);
}
function nextLabel(){ $("next").innerHTML='Next question <span aria-hidden="true">· '+(rnd?'→':'Enter')+'</span>' }
function idle(){
  var p=$("after"); p.className="panel";
  p.innerHTML='<div class="lab mono">FIG_ANSWER</div><div class="idle">'+(mcq?'Pick an answer. If you miss it, the right answer and the reason show here.':'Think of the answer, then show it. Then say if you knew it.')+'</div>'+
    '<div class="keys mono">Keys · '+(mcq?'1–4 or A–D answer · ↑ ↓ move, Enter picks · U = not sure':'Space = show answer · 1 = knew it · 2 = missed')+
    '<br>'+(rnd?'← → = previous / next question':'Enter or N = next')+' · G = guide<br>R = algo · M = MCQ · S = show answers</div>';
  nextLabel(); $("next").disabled=!rnd;
}
function panelAnswer(cls,head,note){
  var book=cur.ch.slice(0,2)==="ca"?"ca":"ga", p=$("after");
  p.className="panel "+cls;
  p.innerHTML='<div class="lab mono">FIG_ANSWER</div><div class="h">'+head+'</div>'+
    (cur.x?'<div class="x">'+esc(cur.x)+'</div>':'')+(note?'<div class="w mono">'+note+'</div>':'')+
    '<div class="act"><a class="btn" href="'+GUIDE[book]+'" target="_blank" rel="noopener">Open the guide</a></div>';
}
function windowNote(){ var st=S.stats[cur.id]; return rnd||!st?'Random mode · not ranked':'Comes back within the next '+Math.round(st.deadline-st.last)+' questions' }
/* reveal the answer: auto (show-answers mode, never ranked) or after "Show answer" in non-MCQ mode */
function showAnswer(auto){
  if(phase!=="ask") return;
  opts().forEach(function(b,i){ b.disabled=true; b.classList.add(order[i]===0?"right":"dim") });
  var nx=$("next");
  if(auto||rnd){
    phase="done"; locked=true;
    panelAnswer("ok","Answer: "+esc(cur.o[0]),auto?'Answers shown · not ranked':'Random mode · not ranked');
    if(!mcq) $("recall").innerHTML='';
    nx.disabled=false; if(kbd&&!auto) nx.focus({preventScroll:true});
    return;
  }
  phase="revealed";
  panelAnswer("ok","Answer: "+esc(cur.o[0]),"");
  $("recall").innerHTML='<div class="grade"><button class="btn primary" id="knew" type="button">Knew it · 1</button><button class="btn" id="missed" type="button">Missed it · 2</button></div>'+
    '<p class="hint mono">Be honest: a miss brings it back within 20.</p>';
  $("knew").onclick=function(){ grade(true) }; $("missed").onclick=function(){ grade(false) };
  if(kbd) $("knew").focus({preventScroll:true});
}
function grade(knew){
  if(phase!=="revealed") return;
  phase="done"; locked=true;
  answer(cur.id,knew?"right":"wrong"); stats();
  $("recall").innerHTML='';
  $("next").disabled=false;
  if(knew){ timer=setTimeout(show,500); return }
  panelAnswer("miss","Answer: "+esc(cur.o[0]),windowNote());
  $("next").focus({preventScroll:true});
}
function toggleUnsure(){
  if(locked||!mcq) return; unsure=!unsure;
  var b=$("unsure"); b.classList.toggle("on",unsure); b.setAttribute("aria-pressed",unsure);
}
function settingsUI(){
  var b=$("mode"); b.textContent=rnd?"Algo off · random":"Algo on"; b.classList.toggle("on",rnd); b.setAttribute("aria-pressed",rnd);
  b=$("mcq"); b.textContent=mcq?"MCQ":"No options"; b.classList.toggle("on",!mcq); b.setAttribute("aria-pressed",!mcq);
  b=$("reveal"); b.textContent=reveal?"Answers shown":"Answers hidden"; b.classList.toggle("on",reveal); b.setAttribute("aria-pressed",reveal);
}
function current(){ return {q:cur,kind:kind,order:order} }
function toggleMode(){
  rnd=!rnd; setFlag(RKEY,rnd); hist=[]; hpos=-1;
  settingsUI(); show();
}
function toggleMcq(){ mcq=!mcq; setFlag("aso-revise-mcq",mcq); settingsUI(); if(cur) render(current()) }
function toggleReveal(){ reveal=!reveal; setFlag("aso-revise-show",reveal); settingsUI(); if(cur&&(reveal?phase==="ask":true)) render(current()) }
function resetRanking(){
  if(!confirm("Reset ranking?\n\nEvery question becomes new again and the New, Weak, Learning and Strong counts start from zero. This can't be undone.")) return;
  S={clock:0,lastActive:0,stats:{},recent:[],answered:0,correct:0}; save(); show();
}
function pick(pos){
  if(locked||phase!=="ask"||!mcq) return; locked=true; phase="done";
  var right=order[pos]===0, g=right?(unsure?"unsure":"right"):"wrong";
  answer(cur.id,g);
  opts().forEach(function(b,i){ b.disabled=true; b.classList.add(order[i]===0?"right":(i===pos?"wrong":"dim")) });
  $("unsureRow").classList.add("gone"); stats();
  var p=$("after"), nx=$("next");
  nx.disabled=false;
  if(g==="right"){
    p.className="panel ok";
    p.innerHTML='<div class="lab mono">FIG_ANSWER</div><div class="good">Right.</div><div class="w mono">Next question in a moment</div>';
    timer=setTimeout(show,750); return;
  }
  panelAnswer(right?"ok":"miss",right?"Right, but you weren't sure":"Answer: "+esc(cur.o[0]),windowNote()+(right||rnd?'':', options shuffled'));
  nx.focus({preventScroll:true});
  if(innerWidth<640) nx.scrollIntoView({behavior:"smooth",block:"nearest"});
}
/* keyboard: works with no mouse at all (see the key list in the answer panel) */
var kbd=false;
function opts(){ return Array.prototype.slice.call(document.querySelectorAll(".opt")) }
function focusOpt(i){ var o=opts(); if(o.length){ i=(i+o.length)%o.length; o[i].focus({preventScroll:true}) } }
document.addEventListener("mousedown",function(){ kbd=false });
document.addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey||e.shiftKey||!cur) return;
  kbd=true;
  var k=e.key.toLowerCase(), i="1234".indexOf(k); if(i<0) i="abcd".indexOf(k);
  var o=opts(), at=o.indexOf(document.activeElement), ae=document.activeElement;
  function stop(){ e.preventDefault() }
  if((k==="enter"||k===" ")&&ae&&/^(mode|mcq|reveal|reset|unsure|knew|missed|showAns)$/.test(ae.id)) return;  // these buttons work normally
  if(k==="r"){ toggleMode(); return stop() }
  if(k==="m"){ toggleMcq(); return stop() }
  if(k==="s"){ toggleReveal(); return stop() }
  if(k==="g"&&phase!=="ask"){ var g=document.querySelector("#after a"); if(g){ g.click(); return stop() } }
  // algo off: ← → step through questions, whatever state the question is in
  if(rnd&&k==="arrowright"){ show(); return stop() }
  if(rnd&&k==="arrowleft"){ show("back"); return stop() }
  if(phase==="ask"&&mcq){
    if(i>=0&&k.length===1){ pick(i); return stop() }
    if(k==="arrowdown"||(!rnd&&k==="arrowright")){ focusOpt(at<0?0:at+1); return stop() }
    if(k==="arrowup"||(!rnd&&k==="arrowleft")){ focusOpt(at<0?o.length-1:at-1); return stop() }
    if(k==="home"||k==="end"){ focusOpt(k==="home"?0:o.length-1); return stop() }
    if(k==="enter"||k===" "){ if(at<0) focusOpt(0); else pick(at); return stop() }
    if(k==="u"){ toggleUnsure(); return stop() }
  }
  if(phase==="ask"&&!mcq&&(k==="enter"||k===" ")){ showAnswer(false); return stop() }
  if(phase==="revealed"&&(k==="1"||k==="2")){ grade(k==="1"); return stop() }
  if(phase==="done"&&(k==="enter"||k===" "||k==="n")){
    if(ae&&ae.tagName==="A") return;  // Enter on the guide link opens it
    show(); return stop() }
  if(rnd&&k==="n"){ show(); return stop() }
});
fetch("app/questions.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){
  bank=d.questions; settingsUI();
  $("mode").onclick=toggleMode; $("mcq").onclick=toggleMcq; $("reveal").onclick=toggleReveal; $("reset").onclick=resetRanking;
  try{ window.focus() }catch(e){}
  $("next").onclick=function(){ if(locked||rnd) show() }; show();
}).catch(function(){
  $("card").innerHTML='<p class="note">Could not load the questions. Open this page from the hub site (it needs app/questions.json next to it).</p>';
});
</script>
</body>
</html>
