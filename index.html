<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASO Study Hub</title>
<meta name="description" content="OPSC ASO 2027 dashboard: syllabus, past papers, mocks and guides.">
<meta name="theme-color" content="#fbfbfb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ASO Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
/* ASO Hub: a dashboard app shell around the study pages.
   To add a page, add one line to the R list in the script. */
:root{
  --bg:#fbfbfb; --paper:#ffffff; --fg:#111111; --muted:#6e6e73; --rule:#d7d7da; --grid:#eef0f6;
  --blue:#2b4cff; --blue-soft:#e0e6ff; --warn:#b4410b;
  --f-serif:"EB Garamond","Iowan Old Style",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-pixel:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
  --nav:216px; --tab:60px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-serif);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.m{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);height:100vh;height:100dvh}
nav.side{border-right:1px solid var(--fg);background:var(--paper);display:flex;flex-direction:column;padding:18px 0 16px;min-height:0}
.brand{padding:0 18px 16px;border-bottom:1px dotted var(--muted)}
.brand b{display:block;font:400 1.7rem/1 var(--f-pixel);color:var(--blue);letter-spacing:.02em}
.brand span{display:block;margin-top:6px}
.navlist{list-style:none;margin:12px 0 0;padding:0}
.navlist a{display:flex;align-items:center;gap:12px;padding:9px 18px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-left:3px solid transparent}
.navlist a:hover{background:var(--blue-soft)}
.navlist a[aria-current="page"]{border-left-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.navlist svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.navlist .c{margin-left:auto;font-size:10px;color:var(--muted)}
.sidefoot{margin-top:auto;padding:12px 18px 0;border-top:1px dotted var(--muted)}
.sidefoot .big{font:400 2rem/1 var(--f-pixel);color:var(--blue)}

.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--fg);background:var(--bg);min-height:56px}
.bar h1{margin:0;font:500 13px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sp{flex:1}
.bar input{width:220px;min-width:0;border:1px solid var(--fg);background:var(--paper);padding:5px 10px;font-family:var(--f-mono);font-size:12px;border-radius:3px}
.bar .days{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--blue);border:1px solid var(--blue);padding:2px 8px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--fg);background:var(--paper);padding:4px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{border-color:var(--blue);color:var(--blue)}
.view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:22px 24px 40px}
.view.frame{padding:0;overflow:hidden}
.view.frame iframe{display:block;width:100%;height:100%;border:0;background:var(--paper)}

/* mobile: bottom tab bar */
nav.tabs{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) calc(var(--tab) + env(safe-area-inset-bottom,0px))}
  nav.side{display:none}
  nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--fg);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  nav.tabs a[aria-current="page"]{color:var(--blue);box-shadow:inset 0 2px 0 var(--blue)}
  nav.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
  .bar{padding:10px 16px;gap:8px}
  .bar input{display:none}
  .bar.searching input{display:block;flex:1}
  .bar.viewing #sbtn{display:none}
  .bar.viewing h1{flex:1}
  .bar.viewing .sp{display:none}
  #full .lbl{display:none}
  .view{padding:16px 16px 28px}
}
@media (min-width:761px){#sbtn{display:none}}

/* ---------- widgets ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{grid-column:span 6;background:var(--paper);border:1px solid var(--rule);padding:14px 16px;min-width:0;position:relative}
.card.s3{grid-column:span 3}.card.s4{grid-column:span 4}.card.s8{grid-column:span 8}.card.s12{grid-column:1/-1}
@media (max-width:1100px){.card.s3{grid-column:span 6}.card.s4,.card.s8{grid-column:span 6}}
@media (max-width:760px){.card,.card.s4,.card.s8,.card.s12{grid-column:1/-1}.card.s3{grid-column:span 6}}
.card h2{margin:0 0 10px;display:flex;align-items:center;gap:10px;font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.card h2::after{content:"";flex:1;border-bottom:1px dotted var(--muted)}
.card h2 a{order:2;font-weight:400;color:var(--blue);font-size:10px}
.kpi .v{font:400 clamp(1.8rem,3.4vw,2.6rem)/1 var(--f-pixel);color:var(--blue);font-variant-numeric:tabular-nums}
.kpi .sub{margin-top:8px}
.kpi.grid-bg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:10px 10px}
.empty{color:var(--muted);font-size:.95rem;padding:10px 0}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .zero{stroke:var(--rule);stroke-width:1}
.chart .ax{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--blue-soft);opacity:.6}
.chart .pt{fill:var(--blue);stroke:var(--paper);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .lab{font-family:var(--f-mono);font-size:9.5px;fill:var(--fg)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:#fff;font-family:var(--f-mono);font-size:11px;line-height:1.5;padding:6px 9px;border-radius:2px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));display:none;z-index:5}
.twocharts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:560px){.twocharts{grid-template-columns:1fr}}
.twocharts .m{display:block;margin-bottom:4px}

/* bars */
.bars{display:grid;gap:9px}
.brow{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:.95rem}
.brow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .trk{height:10px;background:var(--grid);position:relative}
.brow .fil{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:0 2px 2px 0}
.brow .val{font-family:var(--f-mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.brow.zero .lbl,.brow.zero .val{color:var(--warn)}
.brow.zero .trk{background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 4px,#f6e4da 4px,#f6e4da 8px)}

/* lists */
.todo{list-style:none;margin:0;padding:0}
.todo li{border-bottom:1px dotted var(--muted)}
.todo li:last-child{border-bottom:0}
.todo a{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:1.02rem;line-height:1.3}
.todo a:hover{color:var(--blue)}
.todo .ic{font-family:var(--f-mono);color:var(--blue);font-size:12px}
.todo .r{margin-left:auto;white-space:nowrap}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.98rem}
.tbl th{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--fg);white-space:nowrap}
.tbl th button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.tbl th button:hover,.tbl th.on button{color:var(--blue)}
.tbl td{padding:10px 10px 10px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--blue-soft)}
.tbl .num{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tbl .net{font:400 1.1rem/1 var(--f-pixel);color:var(--blue)}
.tbl .t{font-weight:600}
@media (max-width:760px){
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px dotted var(--muted)}
  .tbl.stack td{border:0;padding:0}
  .tbl.stack td.hide-m{display:none}
  .tbl.stack td{width:auto!important}
  .tbl.mk tr{grid-template-columns:minmax(0,1fr) auto}
  .tbl.mk td:nth-child(2){grid-row:1/3;grid-column:1}
  .tbl.mk td:nth-child(3),.tbl.mk td:nth-child(4){grid-column:2;text-align:right}
  .tbl.mk td:nth-child(4):empty{display:none}
  .tbl.stack.one tr{grid-template-columns:minmax(0,1fr);gap:6px}
  .tbl.stack td.num{text-align:right}
}
.chip{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--blue);color:var(--blue);padding:0 5px;line-height:1.7;white-space:nowrap}
.chip.g{border-color:var(--rule);color:var(--muted)}
.chip.w{border:1px dashed var(--warn);color:var(--warn)}
.st-prog{color:var(--warn);font-family:var(--f-mono);font-size:11px}
.st-new{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links a{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);background:var(--paper);padding:2px 7px}
.links a:hover{border-color:var(--blue);color:var(--blue)}
.sec{margin:26px 0 8px;font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.sec:first-child{margin-top:0}
.sec::after{content:"";flex:1;border-bottom:1px dotted var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{border:1px solid var(--fg);background:var(--paper);padding:3px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:3px}
.filters button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.hidden{display:none!important}
</style>
<body>
<div class="app">

<nav class="side" aria-label="Main">
<div class="brand"><b>ASO HUB</b><span class="m">OPSC · Advt 15 / 2026-27</span></div>
<ul class="navlist" id="navlist"></ul>
<div class="sidefoot"><div class="big" id="sideDays">--</div><span class="m">days to 17 Jan 2027</span><br>
<button class="btn" id="saveall" type="button" style="margin-top:10px" hidden>Save offline</button><div class="m" id="savemsg" style="margin-top:6px"></div></div>
</nav>

<div class="main">
<header class="bar" id="bar">
<button class="btn hidden" id="back" type="button" aria-label="Back">&larr; Back</button>
<h1 id="title">Dashboard</h1>
<span class="sp"></span>
<input id="q" type="search" placeholder="Search everything…" autocomplete="off" aria-label="Search">
<button class="btn" id="sbtn" type="button" aria-label="Search">Search</button>
<a class="btn hidden" id="full" href="#" target="_blank" rel="noopener"><span class="lbl">Full screen</span> &nearr;</a>
<span class="days" id="days">--</span>
</header>
<div class="view" id="view"></div>
</div>

<nav class="tabs" aria-label="Main" id="tabs"></nav>
</div>

<script>
/* ===== Data. Add a page = add one line. =====
   t title · f file · s shelf (syllabus|pyq|mock|guide|archive) · p GA|EN|ALL · y chip
   k saved-answers key (tests only) · g mock group · n questions · main = start here */
var R = [
 {t:"Official syllabus", f:"pyq/OPSC-ASO-2026-27-Official-Syllabus.html", s:"syllabus", p:"ALL", y:"2026-27", main:1},

 {t:"GA Paper I 2021 · sorted", f:"pyq/OPSC-ASO-2021-GA-Paper-I.html", s:"pyq", p:"GA", y:"2021", main:1, x:"100 Q · clean"},
 {t:"Geography PYQs", f:"ASO-Geography-PYQs.html", s:"pyq", p:"GA", y:"18–25", x:"60 Q · by topic"},
 {t:"GA Paper I 2025 · scan", f:"pyq/OPSC-ASO-2025-GA-Paper-I-OCR.html", s:"pyq", p:"GA", y:"2025", x:"raw text"},
 {t:"GA Paper I 2018 · scan", f:"pyq/OPSC-ASO-2018-GA-Paper-I-OCR.html", s:"pyq", p:"GA", y:"2018", x:"raw text"},
 {t:"English Paper III 2025", f:"pyq/OPSC-ASO-2025-English-Paper-III.html", s:"pyq", p:"EN", y:"2025", main:1, x:"100 Q · answers"},
 {t:"English Paper III 2021", f:"pyq/OPSC-ASO-2021-English-Paper-III.html", s:"pyq", p:"EN", y:"2021", x:"100 Q · answers"},
 {t:"English Paper III 2018", f:"pyq/OPSC-ASO-2018-English-Paper-III.html", s:"pyq", p:"EN", y:"2018", x:"100 Q · answers"},
 {t:"English 3-year trend", f:"pyq/English-PYQ-Breakdown-2018-2021-2025.html", s:"pyq", p:"EN", y:"18–25", x:"analysis"},

 {t:"English Mock 01", f:"ASO-English-Mock-Test-2027-1.html", s:"mock", p:"EN", g:"English chain", k:"aso-english-mock-2027-1", n:100, y:"M01"},
 {t:"English Mock 02", f:"ASO-English-Mock-Test-2027-2.html", s:"mock", p:"EN", g:"English chain", k:"aso-english-mock-2027-2", n:100, y:"M02"},
 {t:"English Mock 03", f:"ASO-English-Mock-Test-2027-3.html", s:"mock", p:"EN", g:"English chain", k:"aso-english-mock-2027-3", n:100, y:"M03"},
 {t:"English Mock 04 · redo", f:"ASO-English-Mock-Test-2027-4.html", s:"mock", p:"EN", g:"English chain", k:"aso-english-mock-2027-4", n:100, y:"M04", main:1},
 {t:"GS Mock 01", f:"ASO-GS-Mock-Test-2027-1.html", s:"mock", p:"GA", g:"GA / GS", k:"aso-gs-mock-2027-1", n:100, y:"GS01", main:1},
 {t:"GA Mock 1", f:"ASO-GA-Mock-Test-1.html", s:"mock", p:"GA", g:"Older sets", k:"aso-mock1", n:100, y:"GA1"},
 {t:"GS Full Test", f:"ASO-GA-Full-Test-100-MCQ.html", s:"mock", p:"GA", g:"Older sets", k:"aso-gs100-test1", n:100, y:"GSF"},
 {t:"Polity 30", f:"ASO-GA-Polity-30-MCQ.html", s:"mock", p:"GA", g:"Older sets", k:"aso-polity30", n:30, y:"POL1"},
 {t:"Polity 30 · Set 2", f:"ASO-GA-Polity-30-MCQ-Set-2.html", s:"mock", p:"GA", g:"Older sets", k:"aso-polity30-set2", n:30, y:"POL2"},
 {t:"English Full Test 1", f:"ASO-English-Full-Test-100-MCQ.html", s:"mock", p:"EN", g:"Older sets", k:"aso-eng100-test1", n:100, y:"ENF1"},
 {t:"English Full Test 2", f:"ASO-English-Full-Test-2-100-MCQ.html", s:"mock", p:"EN", g:"Older sets", k:"aso-eng100-test2", n:100, y:"ENF2"},
 {t:"Vocabulary Test", f:"ASO-Vocabulary-Test-65-MCQ.html", s:"mock", p:"EN", g:"Older sets", n:65, y:"VOC"},

 {t:"GA Reference Manual", f:"ASO-GA-Reference-Manual.html", s:"guide", p:"GA", y:"Main", main:1, x:"all 10 Paper I topics"},
 {t:"Current Affairs 2026 Manual", f:"ASO-Current-Affairs-2026-Manual.html", s:"guide", p:"GA", y:"2026", main:1, x:"news the way the paper asks"},
 {t:"Vocabulary list", f:"ASO-Vocabulary.html", s:"guide", p:"EN", y:"EN", x:"words + synonyms"},

 {t:"GA Easy Guide", f:"ASO-GA-Easy-Guide.html", s:"archive", p:"GA", y:"Old", x:"older look of the Manual"},
 {t:"GA Study Guide", f:"ASO-GA-Study-Guide.html", s:"archive", p:"GA", y:"Old", x:"first guide"},
 {t:"Current Affairs v1", f:"ASO-Current-Affairs-2026.html", s:"archive", p:"GA", y:"Old", x:"older look"},
 {t:"Polity Magazine", f:"ASO-GA-Polity-Magazine.html", s:"archive", p:"GA", y:"Old", x:"magazine layout"},
 {t:"Polity Woodblock", f:"ASO-GA-Polity-Woodblock.html", s:"archive", p:"GA", y:"Old", x:"flash cards"}
];
var RM="ASO-GA-Reference-Manual.html", CA="ASO-Current-Affairs-2026-Manual.html", GEO="ASO-Geography-PYQs.html";
var SYL=[
 {paper:"Paper I · General Awareness", short:"GA", rows:[
  ["(a)","Current national events",[["Manual",RM+"#current"],["CA 2026",CA],["GS Mock","ASO-GS-Mock-Test-2027-1.html"]]],
  ["(b)","Current international events",[["CA summits",CA+"#summits"],["CA world",CA+"#world"],["CA reports",CA+"#reports"]]],
  ["(c)","British rule & freedom struggle",[["Manual",RM+"#history"],["2021 paper","pyq/OPSC-ASO-2021-GA-Paper-I.html"]]],
  ["(d)","Indian Constitution",[["Manual",RM+"#polity"],["Polity 30","ASO-GA-Polity-30-MCQ.html"],["Polity 30 · 2","ASO-GA-Polity-30-MCQ-Set-2.html"]]],
  ["(e)","World physical geography",[["Manual",RM+"#worldgeo"],["Geo PYQs",GEO+"#world-land"]]],
  ["(f)","India & Odisha geography",[["Manual India",RM+"#indiageo"],["Manual Odisha",RM+"#odisha"],["Geo PYQs",GEO+"#odisha"]]],
  ["(g)","Governance, economy, planning",[["Manual gov",RM+"#governance"],["Manual econ",RM+"#economy"],["CA budget",CA+"#economy"]]],
  ["(h)","Defence & armed forces",[["Manual",RM+"#defence"],["CA defence",CA+"#defence"]]],
  ["(i)","Science, environment, climate",[["Manual sci",RM+"#science"],["Manual env",RM+"#environment"],["CA env",CA+"#env"]]],
  ["(j)","National & international institutions",[["Manual",RM+"#institutions"],["CA summits",CA+"#summits"]]]]},
 {paper:"Paper II (A) · Reasoning", short:"Reasoning", rows:[["A","Verbal: series, direction, coding, ranking, age",[]],["B","Non-verbal: mirror, cubes & dice, figures",[]]]},
 {paper:"Paper II (B) · Mathematics", short:"Maths", rows:[["—","Arithmetic, algebra, mensuration, statistics",[]]]},
 {paper:"Paper III (A) · English", short:"English", rows:[
  ["(i)","Grammar: verb, preposition, adverb, agreement, tenses, articles, errors",[["Mock 04","ASO-English-Mock-Test-2027-4.html"],["Mock 03","ASO-English-Mock-Test-2027-3.html"],["2025 paper","pyq/OPSC-ASO-2025-English-Paper-III.html"]]],
  ["(i)","Vocabulary, synonyms, antonyms",[["Word list","ASO-Vocabulary.html"],["Vocab test","ASO-Vocabulary-Test-65-MCQ.html"],["2018 paper","pyq/OPSC-ASO-2018-English-Paper-III.html"]]],
  ["(ii)","Comprehension",[["Mock 04","ASO-English-Mock-Test-2027-4.html"],["2025 paper","pyq/OPSC-ASO-2025-English-Paper-III.html"]]],
  ["(iii)","Sentence rearrangement",[["Mock 01","ASO-English-Mock-Test-2027-1.html"],["2025 paper","pyq/OPSC-ASO-2025-English-Paper-III.html"]]]]},
 {paper:"Paper III (B) · Odia", short:"Odia", rows:[["—","Grammar, vocabulary, comprehension, rearrangement",[]]]},
 {paper:"Paper IV · Computer (qualifying)", short:"Computer", rows:[["—","Windows, Word, Excel, PowerPoint, Access, internet",[]]]}
];
var EXAM=new Date(2027,0,17);

/* ===== helpers ===== */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function keep(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function isAns(a){return a!==null&&a!==undefined&&a!==-1}
function sig(st){var s=JSON.stringify(st.ans||[])+(st.done?"1":"0"),h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return h}

/* ===== scores =====
   Tests save answers in localStorage under their key. The hub opens a finished test in a hidden
   frame (same site), reads its answer list Q, scores it, and caches the result with the date. */
var SC={};
function quick(r){var st=load(r.k); if(!st||!st.ans) return null;
  return {st:st,answered:st.ans.filter(isAns).length,total:st.ans.length,done:!!st.done}}
function scoreInFrame(r,st){
  return new Promise(function(res){
    var c=load("hub-score:"+r.k), s=sig(st);
    if(c&&c.sig===s&&c.topics) return res(c);
    if(location.protocol==="file:") return res(null);
    var f=document.createElement("iframe"); f.setAttribute("aria-hidden","true"); f.tabIndex=-1;
    f.style.cssText="position:absolute;width:1px;height:1px;left:-9999px;top:0;border:0;visibility:hidden";
    var tm=setTimeout(function(){fin(null)},15000);
    function fin(v){clearTimeout(tm); if(f.parentNode) f.parentNode.removeChild(f); res(v)}
    f.onload=function(){try{
      var Q=f.contentWindow.Q; if(!Q||!Q.length) return fin(null);
      var a=0,w=0,k=0,tp={};
      st.ans.forEach(function(x,i){var q=Q[i]; if(!q) return; var key=(typeof q.ans==="number")?q.ans:q.a, name=q.s||"Other";
        tp[name]=tp[name]||[0,0,0];
        if(!isAns(x)){k++;tp[name][2]++} else if(x===key){a++;tp[name][0]++} else {w++;tp[name][1]++}});
      var o={sig:s,right:a,wrong:w,skip:k,net:a-w*0.25,total:st.ans.length,topics:tp,when:(c&&c.sig===s&&c.when)||Date.now()};
      keep("hub-score:"+r.k,o); fin(o);
    }catch(e){fin(null)}};
    f.src=r.f; document.body.appendChild(f);
  });
}
var busy=false;
function refreshScores(){
  R.forEach(function(r,i){ if(!r.k) return; var q=quick(r), c=q&&q.done?load("hub-score:"+r.k):null;
    SC[i]={q:q,sc:(c&&c.sig===sig(q.st)&&c.topics)?c:null} });
  render();
  if(busy) return;
  var todo=Object.keys(SC).map(Number).filter(function(i){return SC[i].q&&SC[i].q.done&&!SC[i].sc});
  if(!todo.length) return; busy=true;
  (function step(){ if(!todo.length){busy=false; render(); return} var i=todo.shift();
    scoreInFrame(R[i],SC[i].q.st).then(function(sc){SC[i].sc=sc; step()}) })();
}
function status(i){var x=SC[i]; if(!x||!x.q) return "new"; return x.q.done?"done":"prog"}

function trend(p){
  var pts=[]; R.forEach(function(r,i){ if(r.p!==p||!r.k) return; var x=SC[i]; if(x&&x.sc) pts.push({y:r.y,t:r.t,v:x.sc.net/x.sc.total*100,sc:x.sc,i:i}) });
  if(!pts.length) return '<div class="empty">Finish a '+(p==="EN"?"English":"GA")+' mock to start this line.</div>';
  var W=300,H=150,L=28,Rr=10,T=12,B=22, lo=Math.min(0,Math.floor(Math.min.apply(null,pts.map(function(d){return d.v}))/25)*25), hi=100;
  function X(j){return pts.length===1?L+(W-L-Rr)/2:L+j*(W-L-Rr)/(pts.length-1)}
  function Y(v){return T+(hi-v)/(hi-lo)*(H-T-B)}
  var g=''; for(var v=lo;v<=hi;v+=25){g+='<line class="'+(v===0?'zero':'gl')+'" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'</text>'}
  var d=pts.map(function(o,j){return (j?'L':'M')+X(j).toFixed(1)+' '+Y(o.v).toFixed(1)}).join(' ');
  var area=pts.length>1?'<path class="ar" d="'+d+' L'+X(pts.length-1)+' '+Y(Math.max(lo,0))+' L'+X(0)+' '+Y(Math.max(lo,0))+'Z"/>':'';
  var dots=pts.map(function(o,j){var tip=esc(o.t)+'&#10;net '+fmt(o.sc.net)+' / '+o.sc.total+' · '+o.sc.right+'✓ '+o.sc.wrong+'✗ '+o.sc.skip+' skip';
    return '<text class="ax" x="'+X(j)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(o.y)+'</text><circle class="pt" cx="'+X(j)+'" cy="'+Y(o.v)+'" r="4"/>'+
      (j===pts.length-1?'<text class="lab" x="'+X(j)+'" y="'+(Y(o.v)-9)+'" text-anchor="'+(pts.length>1?'end':'middle')+'">'+fmt(o.v)+'%</text>':'')+
      '<circle class="hit" cx="'+X(j)+'" cy="'+Y(o.v)+'" r="14" data-tip="'+tip+'" data-href="'+openHref(R[o.i].f,R[o.i].t)+'"/>'}).join('');
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(p==="EN"?"English":"GA")+' mock scores">'+g+area+'<path class="ln" d="'+d+'"/>'+dots+'</svg><div class="tip"></div></div>';
}
function nextUp(){
  var L=[]; function add(ic,txt,href,r){L.push('<li><a href="'+href+'"><span class="ic">'+ic+'</span><span>'+txt+'</span>'+(r?'<span class="m r">'+r+'</span>':'')+'</a></li>')}
  var en=R.map(function(r,i){return i}).filter(function(i){return R[i].g==="English chain"}), li=en[en.length-1], ls=status(li);
  if(ls!=="done") add("▶",(ls==="prog"?"Finish ":"Take ")+esc(R[li].t),openHref(R[li].f,R[li].t),ls==="prog"?SC[li].q.answered+"/"+SC[li].q.total:"100 Q");
  else add("⧉","Copy "+R[li].y+" answers → paste to Claude",openHref(R[li].f,R[li].t),"next mock");
  var gi=R.findIndex(function(r){return r.k==="aso-gs-mock-2027-1"}), gs=status(gi);
  if(gs!=="done") add("▶",(gs==="prog"?"Finish ":"Take ")+esc(R[gi].t),openHref(R[gi].f,R[gi].t),gs==="prog"?SC[gi].q.answered+"/"+SC[gi].q.total:"100 Q");
  var w=weakList()[0]; if(w) add("↻","Revise "+esc(w.name),w.p==="EN"?openHref("pyq/OPSC-ASO-2025-English-Paper-III.html","English 2025"):openHref(RM,"GA Reference Manual"),w.miss+" missed");
  add("◇","Read the Current Affairs Manual",openHref(CA,"Current Affairs 2026 Manual"),"daily");
  add("✕","Reasoning, Maths, Odia: no material yet","#/syllabus","gap");
  return '<ul class="todo">'+L.join("")+'</ul>';
}
function coverage(){
  return '<div class="bars">'+SYL.map(function(P){var n=P.rows.length,c=P.rows.filter(function(r){return r[2].length}).length,pct=Math.round(c/n*100);
    return '<div class="brow'+(c?'':' zero')+'"><span class="lbl">'+esc(P.short)+'</span><span class="trk"><span class="fil" style="width:'+pct+'%"></span></span><span class="val">'+(c?pct+'%':'none')+'</span></div>'}).join("")+'</div>';
}
function weakList(){
  var agg={};
  R.forEach(function(r,i){var x=SC[i]; if(!x||!x.sc||!x.sc.topics) return;
    Object.keys(x.sc.topics).forEach(function(t){var v=x.sc.topics[t], key=r.p+"|"+t; agg[key]=agg[key]||{name:t,p:r.p,miss:0,all:0}; agg[key].miss+=v[1]+v[2]; agg[key].all+=v[0]+v[1]+v[2]})});
  return Object.keys(agg).map(function(k){var a=agg[k]; a.rate=a.all?a.miss/a.all:0; return a}).filter(function(a){return a.miss>0})
    .sort(function(a,b){return b.rate-a.rate||b.miss-a.miss}).slice(0,6);
}
function weak(){
  var w=weakList(); if(!w.length) return '<div class="empty">Finish a mock and your weakest topics show here.</div>';
  return '<div class="bars">'+w.map(function(a){var pct=Math.round(a.rate*100);
    return '<div class="brow" title="'+a.miss+' of '+a.all+' wrong or skipped"><span class="lbl">'+esc(a.name)+'</span><span class="trk"><span class="fil" style="width:'+pct+'%"></span></span><span class="val">'+a.miss+'/'+a.all+'</span></div>'}).join("")+'</div><div class="m" style="margin-top:10px">wrong + skipped, all finished mocks</div>';
}
function recent(){

var sortKey="order", sortDir=1, mockFilter="all";
V.mocks=function(){
  var rows=R.map(function(r,i){return i}).filter(function(i){var r=R[i]; return r.s==="mock"&&(mockFilter==="all"||r.p===mockFilter)});
  function val(i){var x=SC[i],sc=x&&x.sc; switch(sortKey){
    case "net": return sc?sc.net/sc.total:(x&&x.q?-998:-999); case "right": return sc?sc.right:-1; case "wrong": return sc?sc.wrong:-1;
    case "skip": return sc?sc.skip:-1; case "when": return sc?sc.when:0; case "title": return R[i].t; default: return i}}
  rows.sort(function(a,b){var A=val(a),B=val(b); return (A>B?1:A<B?-1:0)*sortDir});
  function th(k,l,cls){return '<th class="'+(cls||'')+(sortKey===k?' on':'')+'"><button data-sort="'+k+'">'+l+(sortKey===k?(sortDir>0?' ↑':' ↓'):'')+'</button></th>'}
  var h='<div class="filters">'+[["all","All"],["EN","English"],["GA","GA / GS"]].map(function(f){return '<button data-mf="'+f[0]+'" aria-pressed="'+(mockFilter===f[0])+'">'+f[1]+'</button>'}).join("")+'</div>';
  h+='<table class="tbl stack mk"><thead><tr>'+th("order","#")+th("title","Test")+'<th>Status</th>'+th("net","Net","num")+th("right","✓","num")+th("wrong","✗","num")+th("skip","Skip","num")+th("when","Date")+'</tr></thead><tbody>';
  h+=rows.map(function(i){var r=R[i],x=SC[i],sc=x&&x.sc,st=status(i);
    var s=st==="done"?'<span class="chip">Done</span>':st==="prog"?'<span class="st-prog">'+x.q.answered+'/'+x.q.total+'</span>':(r.k?'<span class="st-new">Not started</span>':'<span class="st-new">No score saved</span>');

      '<td class="num">'+(sc?'<span class="net">'+fmt(sc.net)+'</span>':'')+'</td><td class="num hide-m">'+(sc?sc.right:'')+'</td><td class="num hide-m">'+(sc?sc.wrong:'')+'</td><td class="num hide-m">'+(sc?sc.skip:'')+'</td><td class="hide-m"><span class="m">'+(sc&&sc.when?day(sc.when):'')+'</span></td></tr>'}).join("");

var cur="dashboard";
function route(){
  var h=location.hash.replace(/^#\/?/,"")||"dashboard", view=$("#view"), q=$("#q").value.trim();
  var parts=h.split("?"), name=parts[0], params=new URLSearchParams(parts[1]||"");
  var isOpen=name==="open";
  $("#bar").classList.toggle("viewing",isOpen); $("#back").classList.toggle("hidden",!isOpen); $("#full").classList.toggle("hidden",!isOpen);
  $("#days").classList.toggle("hidden",isOpen&&innerWidth<761);
  if(isOpen){
    var f=params.get("f")||"", t=params.get("t")||titleOf(f);
    if(!/^[\w\-./#]+$/.test(f)||/^\/\/|:/.test(f)){location.hash="#/dashboard";return}
    $("#title").textContent=t; $("#full").href=f; view.className="view frame";
    if(!view.querySelector("iframe")||view.dataset.f!==f){view.innerHTML='<iframe title="'+esc(t)+'" src="'+esc(f)+'"></iframe>'; view.dataset.f=f}
    mark(cur); return;
  }
  view.className="view"; view.dataset.f="";
  if(!V[name]) name="dashboard";
  cur=name; mark(name);
  $("#title").textContent=q?"Search":NAV.filter(function(n){return n[0]===name})[0][1];
  view.innerHTML=q?V.search(q):V[name]();
  view.scrollTop=0;
}
function render(){ if(!/^#\/?open/.test(location.hash)){var y=$("#view").scrollTop; route(); $("#view").scrollTop=y} }
function mark(n){$$("[data-v]").forEach(function(a){a.toggleAttribute("aria-current",a.dataset.v===n); if(a.dataset.v===n) a.setAttribute("aria-current","page")})}
window.addEventListener("hashchange",route);
$("#back").addEventListener("click",function(){ if(history.length>1) history.back(); else location.hash="#/"+cur });
$("#q").addEventListener("input",function(){ if(/^#\/?open/.test(location.hash)) location.hash="#/"+cur; else route() });
$("#sbtn").addEventListener("click",function(){var b=$("#bar"); b.classList.toggle("searching"); if(b.classList.contains("searching")) $("#q").focus(); else {$("#q").value=""; route()}});

    (function step(){ if(!list.length){$("#savemsg").textContent="Saved "+ok+" pages"; b.disabled=false; return}
      fetch(list.shift(),{cache:"reload"}).then(function(r){if(r.ok) ok++}).catch(function(){}).then(function(){$("#savemsg").textContent="Saving "+ok+"/"+n; step()}) })();
  });
}
</script>
