<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASO Study Hub</title>
<meta name="description" content="OPSC ASO 2027 dashboard: every guide, test and past paper, sorted by subject and topic.">
<meta name="theme-color" content="#fbfbfb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ASO Hub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
/* ASO Hub. Everything is filed two ways:
   by SUBJECT (the six parts of the exam) and by KIND (guides, tests, past papers).
   To add a page, add one line to the R list in the script. */
:root{
  --bg:#fbfbfb; --paper:#ffffff; --fg:#111111; --muted:#6e6e73; --rule:#d7d7da; --grid:#eef0f6;
  --blue:#2b4cff; --blue-soft:#e0e6ff; --warn:#b4410b;
  --f-serif:"EB Garamond","Iowan Old Style",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-pixel:"Silkscreen","IBM Plex Mono",ui-monospace,monospace;
  --nav:240px; --tab:60px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-serif);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.m{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.none{color:#b9b9bf}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);height:100vh;height:100dvh}
nav.side{border-right:1px solid var(--fg);background:var(--paper);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px dotted var(--muted)}
.brand b{display:block;font:400 1.7rem/1 var(--f-pixel);color:var(--blue);letter-spacing:.02em}
.brand span{display:block;margin-top:6px}
.navscroll{flex:1;min-height:0;overflow:auto;padding:10px 0}
.ng{padding:14px 18px 5px}
.ni{display:flex;align-items:center;gap:10px;padding:7px 18px 7px 15px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;border-left:3px solid transparent;line-height:1.25}
.ni:hover{background:var(--blue-soft)}
.ni[aria-current="page"]{border-left-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.ni svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.ni .rn{width:17px;flex:none;color:var(--blue);font-size:10.5px;letter-spacing:0}
.ni .c{margin-left:auto;font-size:10px;color:var(--muted)}
.ni.off,.ni.off .rn{color:var(--muted)}
.sidefoot{padding:12px 18px 16px;border-top:1px dotted var(--muted)}
.sidefoot .big{font:400 2rem/1 var(--f-pixel);color:var(--blue)}

.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:10px 28px;border-bottom:1px solid var(--fg);background:var(--bg);min-height:52px}
.bar h1{margin:0;font:500 12px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar h1 i{font-style:normal;color:var(--muted)}
.bar .sp{flex:1}
.bar input{width:240px;min-width:0;border:1px solid var(--fg);background:var(--paper);padding:5px 10px;font-family:var(--f-mono);font-size:12px;border-radius:3px}
.bar .days{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--blue);border:1px solid var(--blue);padding:2px 8px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--fg);background:var(--paper);padding:4px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;white-space:nowrap}
.btn:hover,.btn.pri{border-color:var(--blue);color:var(--blue)}
.view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:26px 28px 48px}
.view.frame{padding:0;overflow:hidden}
.view.frame iframe{display:block;width:100%;height:100%;border:0;background:var(--paper)}
.wrap{max-width:1080px;margin:0 auto}

nav.tabs{display:none}
@media (min-width:761px){#sbtn,.bar .days{display:none}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) calc(var(--tab) + env(safe-area-inset-bottom,0px))}
  nav.side{display:none}
  nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--fg);background:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--f-mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  nav.tabs a[aria-current="page"]{color:var(--blue);box-shadow:inset 0 2px 0 var(--blue)}
  nav.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
  .bar{padding:10px 16px;gap:8px}
  .bar input{display:none}
  .bar h1 .bc{display:none}
  .bar.searching input{display:block;flex:1}
  .bar.searching h1,.bar.searching .days{display:none}
  .bar.viewing #sbtn,.bar.viewing .sp{display:none}
  .bar.viewing h1{flex:1}
  #full .lbl{display:none}
  .view{padding:18px 16px 30px}
}

/* ---------- page furniture ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 16px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{margin:5px 0 0;font:500 2.1rem/1.08 var(--f-serif);letter-spacing:-.01em}
.ph p{margin:6px 0 0;color:#444;max-width:46em}
.sec{display:flex;align-items:baseline;gap:10px;margin:28px 0 8px}
.sec .no{font:400 .95rem/1 var(--f-pixel);color:var(--blue)}
.sec h3{margin:0;font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.sec .lead{flex:1;border-bottom:1px dotted var(--muted);min-width:12px}
.sec .ct{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sec a.more{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.panel{background:var(--paper);border:1px solid var(--rule);min-width:0}
.panel>.hd{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;border-bottom:1px solid var(--fg)}
.note{margin:12px 0 0;color:var(--muted);font-size:.95rem}
.note b{font-weight:500;color:var(--warn)}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0 20px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1080px){.two{grid-template-columns:minmax(0,1fr)}.three{grid-template-columns:minmax(0,1fr)}}

/* number strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--paper);border:1px solid var(--rule)}
.strip .cell{padding:12px 16px 13px;border-left:1px solid var(--rule);min-width:0}
.strip .cell:first-child{border-left:0}
.strip .v{display:block;margin:7px 0 6px;font:400 clamp(1.6rem,3vw,2.2rem)/1 var(--f-pixel);color:var(--blue);font-variant-numeric:tabular-nums}
.strip .v small{font-size:.5em;color:var(--muted)}
.strip .v.txt{font:500 1.25rem/1.15 var(--f-serif);color:var(--fg);min-height:1.6em}
@media (max-width:760px){
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip .cell:nth-child(3){border-left:0}
  .strip .cell:nth-child(n+3){border-top:1px solid var(--rule)}
}

/* rows: one line per page, with a dotted leader */
.row{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule);line-height:1.3}
.rows>.row:last-child,.rows>details:last-child>.row:last-child{border-bottom:0}
.row:hover{background:var(--blue-soft)}
.row:hover .t{color:var(--blue)}
.row .t{flex:0 1 auto;min-width:0;font-weight:500;overflow-wrap:anywhere}
.row .t .chip{margin-left:6px;vertical-align:1px}
.row .x{display:block;margin-top:3px;font-weight:400}
.row .lead{flex:1 1 12px;min-width:12px;border-bottom:1px dotted #a9a9ae}
.row .go{font-family:var(--f-mono);font-size:12px;color:#a9a9ae}
.row:hover .go{color:var(--blue)}
.row .r{white-space:nowrap;display:inline-flex;gap:5px;align-items:baseline}
.row .n{flex:none;width:1.2em;font:400 1rem/1 var(--f-pixel);color:var(--blue)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--blue);flex:none;display:inline-block}
.dot.done{background:var(--blue)}
.dot.prog{background:linear-gradient(90deg,var(--blue) 50%,transparent 50%)}
.dot.new,.dot.none{border-color:#a9a9ae}
.net{font:400 1.05rem/1 var(--f-pixel);color:var(--blue)}
.st-prog{color:var(--warn);font-family:var(--f-mono);font-size:11px}
.chip{display:inline-block;flex:none;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--blue);color:var(--blue);padding:0 5px;line-height:1.7;white-space:nowrap}
.chip.fill{background:var(--blue);color:#fff}
details>summary{list-style:none;cursor:pointer;padding:8px 14px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule)}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+ "}
details[open]>summary::before{content:"– "}
details>summary:hover{color:var(--blue)}
.rows>details:last-child:not([open])>summary{border-bottom:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.filters button,.filters a{border:1px solid var(--fg);background:var(--paper);padding:3px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:3px}
.filters [aria-pressed="true"],.filters [aria-current="page"]{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.sw{display:none}
@media (max-width:760px){.sw{display:flex;margin-bottom:14px}}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:.98rem}
.tbl th{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--fg);white-space:nowrap}
.tbl th button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.tbl th button:hover,.tbl th.on button{color:var(--blue)}
.tbl td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{padding-left:14px}
.tbl th:last-child,.tbl td:last-child{padding-right:14px}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--blue-soft)}
.tbl tr.grp td{padding:14px 14px 6px;border-bottom:1px solid var(--fg);font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.tbl .num{font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num{text-align:right}
.tbl .t{font-weight:500}
.tbl .rn{font:400 .95rem/1 var(--f-pixel);color:var(--blue)}
.tbl tr.off .t,.tbl tr.off .rn{color:var(--muted)}
.tbl .sm{display:none}
.tbl a.cl{color:var(--blue)}
.tbl a.cl:hover{text-decoration:underline}
.cov{display:flex;align-items:center;gap:10px}
.trk{flex:1;height:8px;background:var(--grid);position:relative;min-width:40px;display:block}
.fil{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:0 2px 2px 0;display:block}
.val{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:760px){
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:10px 14px;border-bottom:1px solid var(--rule)}
  .tbl.stack tbody tr:last-child{border-bottom:0}
  .tbl.stack td{border:0;padding:0!important;width:auto!important}
  .tbl.stack td.hide-m{display:none}
  .tbl.stack tr.grp{padding:14px 14px 6px;border-bottom:1px solid var(--fg)}
  .tbl.stack tr.grp td{border-bottom:0}
  .tbl .sm{display:block;margin-top:2px}
  .tbl.tests td:nth-child(1){grid-row:1/3;grid-column:1}
  .tbl.tests td:nth-child(2),.tbl.tests td:nth-child(3){grid-column:2;text-align:right}
  .tbl.tests td:nth-child(3):empty{display:none}
  .tbl.bd tr{grid-template-columns:2em minmax(0,1fr) auto}
  .tbl.bd td:nth-child(6){grid-column:2/-1;grid-row:2}
  .tbl.yr tr{grid-template-columns:minmax(0,1fr);gap:6px}
  .tbl.yr td[data-l]{display:flex;gap:10px;align-items:baseline}
  .tbl.yr td[data-l]::before{content:attr(data-l);flex:0 0 5.4em;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
}

/* topic table: one row per syllabus topic, same columns everywhere */
.mx .hd,.mx .tr{display:grid;grid-template-columns:2.4rem minmax(0,1.9fr) 8.6rem minmax(0,1fr) minmax(0,.85fr) minmax(0,1.35fr) 6rem;gap:2px 14px;align-items:baseline;padding:8px 14px}
.mx .hd{border-bottom:1px solid var(--fg);font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mx .tr{border-bottom:1px solid var(--rule)}
.mx .tr:last-child{border-bottom:0}
.mx .code{font-family:var(--f-mono);font-size:11px;color:var(--blue);white-space:nowrap}
.mx .tn{font-weight:500;min-width:0;overflow-wrap:anywhere}
.mx .ask{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.mx .ask b{font-weight:500;color:var(--fg)}
.mx .ask i{display:none;font-style:normal}
.mx .hd .ask{font-size:10px}
.mx .lk{min-width:0}
.mx .lk a{color:var(--blue);white-space:nowrap}
.mx .lk a:hover{text-decoration:underline}
.mx .lk s{text-decoration:none;color:#b9b9bf;padding:0 2px}
.mx .you{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mx .hd .you{font-size:10px}
.yb{width:34px;height:6px;background:var(--grid);position:relative;display:inline-block}
.yb span{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
@media (max-width:1080px){
  .mx .hd{display:none}
  .mx .tr{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px}
  .mx .code{display:none}
  .mx .tn{grid-column:1;grid-row:1}
  .mx .you{grid-column:2;grid-row:1}
  .mx .tr>[data-l]{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;text-align:left}
  .mx .tr>[data-l]::before{content:attr(data-l);flex:0 0 5.4em;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .mx .tr>.lk.empty{display:none}
  .mx .ask{display:flex;gap:14px}
  .mx .ask i{display:inline;margin-right:4px;font-size:10px}
  .mx .lk a{white-space:normal}
}
.tlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;padding:6px 14px 10px}
.tlist>span{display:flex;gap:9px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--rule);min-width:0}
.tlist .dot{transform:translateY(-1px)}
@media (max-width:600px){.tlist{grid-template-columns:minmax(0,1fr)}}

/* figures (charts sit in dashed boxes on grid paper) */
.fig{position:relative;border:1px dashed #9aa3c7;padding:12px 12px 8px 30px;min-width:0;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px}
.fig .tag{position:absolute;left:9px;top:12px;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;color:var(--blue)}
.fig .cap{display:block;margin-bottom:4px}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.figs{grid-template-columns:minmax(0,1fr)}}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:#dfe3f0;stroke-width:1}
.chart .zero{stroke:#b9b9bf;stroke-width:1}
.chart .ax{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--blue-soft);opacity:.6}
.chart .pt{fill:var(--blue);stroke:var(--paper);stroke-width:2}
.chart .pend{fill:var(--paper);stroke:#a9a9ae;stroke-width:1.2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .lab{font-family:var(--f-mono);font-size:9.5px;fill:var(--fg)}
.chart .wait{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted);letter-spacing:.06em}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:#fff;font-family:var(--f-mono);font-size:11px;line-height:1.5;padding:6px 9px;border-radius:2px;white-space:pre;transform:translate(-50%,calc(-100% - 10px));display:none;z-index:5}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 84px 3.6em;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule)}
.brow:last-child{border-bottom:0}
.brow:hover{background:var(--blue-soft)}
.brow .lbl{min-width:0;overflow-wrap:anywhere;line-height:1.25}
.brow .val{text-align:right}
.empty{color:var(--muted);padding:12px 14px}
</style>
<body>
<div class="app">

<nav class="side" aria-label="Main">
<div class="brand"><b>ASO HUB</b><span class="m">OPSC · Advt 15 / 2026-27</span></div>
<div class="navscroll" id="sidenav"></div>
<div class="sidefoot"><div class="big" id="sideDays">--</div><span class="m">days to 17 Jan 2027</span><br>
<button class="btn" id="saveall" type="button" style="margin-top:10px" hidden>Save offline</button><div class="m" id="savemsg" style="margin-top:6px"></div></div>
</nav>

<div class="main">
<header class="bar" id="bar">
<button class="btn hidden" id="back" type="button" aria-label="Back">&larr; Back</button>
<h1 id="title">Home</h1>
<span class="sp"></span>
<input id="q" type="search" placeholder="Search pages and topics…" autocomplete="off" aria-label="Search">
<button class="btn" id="sbtn" type="button" aria-label="Search">Search</button>
<a class="btn hidden" id="full" href="#" target="_blank" rel="noopener"><span class="lbl">Full screen</span> &nearr;</a>
<span class="days" id="days">--</span>
</header>
<div class="view" id="view"></div>
</div>

<nav class="tabs" aria-label="Main" id="tabs"></nav>
</div>

<script>
/* ===== 1. PAGES. Add a page = add one line. =====
   t title · f file · s kind (guide|mock|pyq|archive|syllabus) · p subject (GA|EN) · y short code or year
   x one-line note · main = start here · tests only: k saved-answers key, n questions, g group,
   topic = every question belongs to this one topic id (for single-topic sets) */
var RM="ASO-GA-Reference-Manual.html", CA="ASO-Current-Affairs-2026-Manual.html", GEO="ASO-Geography-PYQs.html",
    G21="pyq/OPSC-ASO-2021-GA-Paper-I.html", E25="pyq/OPSC-ASO-2025-English-Paper-III.html", EG="ASO-English-Grammar-Guide-2027.html",
    E21="pyq/OPSC-ASO-2021-English-Paper-III.html", E18="pyq/OPSC-ASO-2018-English-Paper-III.html";
var R = [
 {t:"Official scheme & syllabus", f:"pyq/OPSC-ASO-2026-27-Official-Syllabus.html", s:"syllabus", p:"ALL", y:"2026-27"},

/* ===== helpers ===== */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function keep(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function isAns(a){return a!==null&&a!==undefined&&a!==-1}
function sig(st){var s=JSON.stringify(st.ans||[])+(st.done?"1":"0"),h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0}return h}
function fmt(x){return (Math.round(x*100)/100).toString()}
function day(ms){return new Date(ms).toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function openHref(f,t){return "#/open?f="+encodeURIComponent(f)+"&t="+encodeURIComponent(t||"")}
function titleOf(f){var b=f.split("#")[0];for(var i=0;i<R.length;i++) if(R[i].f===b) return R[i].t; return b}
function subOf(r){return r.p==="GA"?"ga":r.p==="EN"?"en":r.p==="RE"?"re":r.p==="MA"?"ma":r.p==="OD"?"od":null}
function subById(id){for(var i=0;i<SYL.length;i++) if(SYL[i].id===id) return SYL[i]; return null}
function has(t){return !!((t.g&&t.g.length)||(t.t&&t.t.length)||(t.p&&t.p.length))}
function norm(s){return String(s).replace(/^\d+\s+/,"").replace(/[–—]/g,"-").toLowerCase().trim()}
function plural(n,w){return n+" "+w+(n===1?"":"s")}
var TAG={}; SYL.forEach(function(S){TAG[S.id]={}; S.topics.forEach(function(t){(t.tags||[]).forEach(function(g){TAG[S.id][norm(g)]=t.id})})});

/* ===== scores =====
   Tests save answers in localStorage under their key. The hub opens a finished test in a hidden
   frame (same site), reads its answer list Q, scores it, and caches the result with the date. */
var SC={};
function quick(r){var st=load(r.k); if(!st||!st.ans) return null;
  return {st:st,answered:st.ans.filter(isAns).length,total:st.ans.length,done:!!st.done}}
function scoreInFrame(r,st){
  return new Promise(function(res){
    var c=load("hub-score:"+r.k), s=sig(st);
    if(c&&c.sig===s&&c.topics) return res(c);
    if(location.protocol==="file:") return res(null);
    var f=document.createElement("iframe"); f.setAttribute("aria-hidden","true"); f.tabIndex=-1;
    f.style.cssText="position:absolute;width:1px;height:1px;left:-9999px;top:0;border:0;visibility:hidden";
    var tm=setTimeout(function(){fin(null)},15000);
    function fin(v){clearTimeout(tm); if(f.parentNode) f.parentNode.removeChild(f); res(v)}
    f.onload=function(){try{
      var Q=f.contentWindow.Q; if(!Q||!Q.length) return fin(null);
      var a=0,w=0,k=0,tp={};
      st.ans.forEach(function(x,i){var q=Q[i]; if(!q) return; var key=(typeof q.ans==="number")?q.ans:q.a, name=q.s||"Other";
        tp[name]=tp[name]||[0,0,0];
        if(!isAns(x)){k++;tp[name][2]++} else if(x===key){a++;tp[name][0]++} else {w++;tp[name][1]++}});
      var o={sig:s,right:a,wrong:w,skip:k,net:a-w*0.25,total:st.ans.length,topics:tp,when:(c&&c.sig===s&&c.when)||Date.now()};
      keep("hub-score:"+r.k,o); fin(o);
    }catch(e){fin(null)}};
    f.src=r.f; document.body.appendChild(f);
  });
}
var busy=false;
function refreshScores(){
  R.forEach(function(r,i){ if(!r.k) return; var q=quick(r), c=q&&q.done?load("hub-score:"+r.k):null;
    SC[i]={q:q,sc:(c&&c.sig===sig(q.st)&&c.topics)?c:null} });
  render();
  if(busy) return;
  var todo=Object.keys(SC).map(Number).filter(function(i){return SC[i].q&&SC[i].q.done&&!SC[i].sc});
  if(!todo.length) return; busy=true;
  (function step(){ if(!todo.length){busy=false; render(); return} var i=todo.shift();
    scoreInFrame(R[i],SC[i].q.st).then(function(sc){SC[i].sc=sc; step()}) })();
}
function status(i){var r=R[i]; if(!r.k) return "none"; var x=SC[i]; if(!x||!x.q) return "new"; return x.q.done?"done":"prog"}

/* everything known about one subject */
function subj(S){
  var res=R.filter(function(r){return subOf(r)===S.id});
  var o={guides:res.filter(function(r){return r.s==="guide"}), arch:res.filter(function(r){return r.s==="archive"}),
         tests:res.filter(function(r){return r.s==="mock"}), papers:res.filter(function(r){return r.s==="pyq"}),
         cov:S.topics.filter(has).length, done:0, best:null};
  o.count=o.guides.length+o.tests.length+o.papers.length;
  o.tests.forEach(function(r){var x=SC[R.indexOf(r)]; if(x&&x.q&&x.q.done){o.done++; if(x.sc&&x.sc.total===100) o.best=Math.max(o.best===null?-999:o.best,x.sc.net)}});
  return o;
}
/* right / wrong / skipped per syllabus topic, across every finished test */
function topicStats(){
  var m={};
  R.forEach(function(r,i){var x=SC[i], sid=subOf(r); if(!sid||!x||!x.sc||!x.sc.topics) return;
    Object.keys(x.sc.topics).forEach(function(tag){var id=r.topic||TAG[sid][norm(tag)]; if(!id) return;
      var v=x.sc.topics[tag], k=sid+"|"+id; m[k]=m[k]||[0,0,0]; m[k][0]+=v[0]; m[k][1]+=v[1]; m[k][2]+=v[2]})});
  return m;
}
function weakList(){
  var ts=topicStats(), L=[];
  SYL.forEach(function(S){S.topics.forEach(function(t){var v=t.id&&ts[S.id+"|"+t.id]; if(!v) return; var all=v[0]+v[1]+v[2];
    if(all<3||v[0]===all) return; L.push({S:S,t:t,right:v[0],all:all,acc:v[0]/all})})});
  return L.sort(function(a,b){return a.acc-b.acc||b.all-a.all});
}

/* one page = one row. Tests show a status dot and score, papers a year, guides a note. */
function row(r,tagSub){
  var i=R.indexOf(r), st=status(i), x=SC[i], sc=x&&x.sc, left="", right;
  if(r.s==="mock"){
    left='<span class="dot '+st+'"></span>';
    right=st==="done"?(sc?'<span class="net">'+fmt(sc.net)+'</span><span class="m">/'+sc.total+'</span>':'<span class="m">Done</span>')
         :st==="prog"?'<span class="st-prog">'+x.q.answered+'/'+x.q.total+'</span>':'<span class="m">'+r.n+' Q</span>';
  } else { if(r.s==="pyq") left='<span class="chip">'+esc(r.y)+'</span>'; right='<span class="go">&rarr;</span>' }
  var flag=r.main?(r.s==="mock"?(st==="done"?'':'<span class="chip fill">Next</span>'):'<span class="chip fill">Start here</span>'):'';
  var S=tagSub&&subById(subOf(r)), note=[S?S.name:"",r.s==="mock"?(S?r.g:""):(r.x||"")].filter(Boolean).join(" · ");
  return '<a class="row" href="'+openHref(r.f,r.t)+'">'+left+'<span class="t">'+esc(r.t)+flag+(note?'<span class="x m">'+esc(note)+'</span>':'')+'</span><span class="lead"></span><span class="r">'+right+'</span></a>';
}
function rows(list,tagSub){return list.map(function(r){return row(r,tagSub)}).join("")}
function fold(label,list){return list.length?'<details><summary>'+label+' · '+list.length+'</summary>'+rows(list)+'</details>':''}
function links(a){return (a&&a.length)?a.map(function(x){return '<a href="'+openHref(x[1],titleOf(x[1]))+'">'+esc(x[0])+'</a>'}).join(' <s>·</s> '):'<span class="none">—</span>'}

/* the subjects board: the whole exam in six rows */
function board(){

  SYL.forEach(function(S){var o=subj(S), n=S.topics.length, pct=Math.round(o.cov/n*100);
    h+='<tr class="rowlink'+(o.count?'':' off')+'" data-href="#/s/'+S.id+'"><td><span class="rn">'+S.no+'</span></td>'+

function trend(sid,fig){
  var S=subById(sid), slots=[], pts=[];
  R.forEach(function(r,i){ if(subOf(r)!==sid||!r.k) return; slots.push(r); var x=SC[i]; if(x&&x.sc) pts.push({y:r.y,t:r.t,v:x.sc.net/x.sc.total*100,sc:x.sc,i:i}) });
  var W=300,H=150,L=28,Rr=10,T=12,B=22, hi=100, lo=pts.length?Math.min(0,Math.floor(Math.min.apply(null,pts.map(function(d){return d.v}))/25)*25):0;
  var n=pts.length||Math.min(slots.length,6);
  function X(j){return n<2?L+(W-L-Rr)/2:L+10+j*(W-L-Rr-20)/(n-1)}
  function Y(v){return T+(hi-v)/(hi-lo)*(H-T-B)}
  var g=''; for(var v=lo;v<=hi;v+=25){g+='<line class="'+(v===0?'zero':'gl')+'" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'</text>'}
  var body;
  if(!pts.length){
    body=slots.slice(0,n).map(function(r,j){return '<text class="ax" x="'+X(j)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(r.y)+'</text><circle class="pend" cx="'+X(j)+'" cy="'+Y(0)+'" r="3.5"/>'}).join('')+
      '<text class="wait" x="'+((L+W-Rr)/2)+'" y="'+(Y(50)+3)+'" text-anchor="middle">NO FINISHED TEST YET</text>';
  } else {
    var d=pts.map(function(o,j){return (j?'L':'M')+X(j).toFixed(1)+' '+Y(o.v).toFixed(1)}).join(' ');
    body=(pts.length>1?'<path class="ar" d="'+d+' L'+X(pts.length-1)+' '+Y(Math.max(lo,0))+' L'+X(0)+' '+Y(Math.max(lo,0))+'Z"/>':'')+'<path class="ln" d="'+d+'"/>'+
      pts.map(function(o,j){var tip=esc(o.t)+'&#10;net '+fmt(o.sc.net)+' / '+o.sc.total+' · '+o.sc.right+'✓ '+o.sc.wrong+'✗ '+o.sc.skip+' skip';
        return '<text class="ax" x="'+X(j)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(o.y)+'</text><circle class="pt" cx="'+X(j)+'" cy="'+Y(o.v)+'" r="4"/>'+
          (j===pts.length-1?'<text class="lab" x="'+X(j)+'" y="'+(Y(o.v)-9)+'" text-anchor="'+(pts.length>1?'end':'middle')+'">'+fmt(o.v)+'%</text>':'')+
          '<circle class="hit" cx="'+X(j)+'" cy="'+Y(o.v)+'" r="14" data-tip="'+tip+'" data-href="'+openHref(R[o.i].f,R[o.i].t)+'"/>'}).join('');
  }
  return '<div class="fig"><span class="tag">FIG_00'+fig+'</span><span class="m cap">'+S.name+' · net score, %</span><div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+S.name+' test scores">'+g+body+'</svg><div class="tip"></div></div></div>';
}

function nextList(){
  var L=[["Revise: endless GA questions",openHref("revise.html","Revise · endless questions"),"new every 2nd"]];
  R.forEach(function(r,i){ if(r.k&&status(i)==="prog"&&L.length<2) L.push(["Finish "+r.t,openHref(r.f,r.t),SC[i].q.answered+"/"+SC[i].q.total]) });
  R.forEach(function(r,i){ if(r.s==="mock"&&r.main&&status(i)==="new") L.push(["Take "+r.t,openHref(r.f,r.t),r.n+" Q"]) });
  var en=R.filter(function(r){return r.g==="English mocks"}), last=en[en.length-1];
  if(last&&status(R.indexOf(last))==="done") L.push(["Copy your "+last.t.replace(/ ·.*/,"")+" answers and paste them to Claude",openHref(last.f,last.t),"next mock"]);

}

var sortKey="order", sortDir=1, testFilter="all";
V.tests=function(){
  var idx=R.map(function(r,i){return i}).filter(function(i){var r=R[i]; return r.s==="mock"&&(testFilter==="all"||subOf(r)===testFilter)});
  function val(i){var x=SC[i],sc=x&&x.sc; switch(sortKey){
    case "net": return sc?sc.net/sc.total:(x&&x.q?-998:-999); case "right": return sc?sc.right:-1; case "wrong": return sc?sc.wrong:-1;
    case "skip": return sc?sc.skip:-1; case "when": return sc?sc.when:0; case "title": return R[i].t; default: return i}}
  idx.sort(function(a,b){var A=val(a),B=val(b); return (A>B?1:A<B?-1:0)*sortDir});
  function th(k,l,cls){return '<th class="'+(cls||'')+(sortKey===k?' on':'')+'"><button data-sort="'+k+'">'+l+(sortKey===k?(sortDir>0?' ↑':' ↓'):'')+'</button></th>'}
  var h=ph("Library","Tests","Every mock and topic set. A wrong answer costs 0.25, the same as the real exam.");
  h+='<div class="filters">'+[["all","All"],["en","English"],["ga","General Awareness"]].map(function(f){return '<button data-tf="'+f[0]+'" aria-pressed="'+(testFilter===f[0])+'">'+f[1]+'</button>'}).join("")+(sortKey!=="order"?'<button data-sort="order">Group again</button>':'')+'</div>';
  h+='<div class="panel"><table class="tbl stack tests"><thead><tr>'+th("title","Test")+'<th>Status</th>'+th("net","Net","num")+th("right","✓","num")+th("wrong","✗","num")+th("skip","Skip","num")+th("when","Date","num")+'</tr></thead><tbody>';
  var g=null;
  idx.forEach(function(i){var r=R[i],x=SC[i],sc=x&&x.sc,st=status(i);
    if(sortKey==="order"&&r.g!==g){g=r.g; h+='<tr class="grp"><td colspan="7">'+esc(g)+'</td></tr>'}
    var s=st==="done"?'<span class="chip">Done</span>':st==="prog"?'<span class="st-prog">'+x.q.answered+'/'+x.q.total+'</span>':'<span class="m">'+(st==="new"?'Not started':'No score saved')+'</span>';
    h+='<tr class="rowlink" data-href="'+openHref(r.f,r.t)+'"><td><span class="t">'+esc(r.t)+'</span>'+(r.main&&st!=="done"?' <span class="chip fill">Next</span>':'')+'<br><span class="m">'+subById(subOf(r)).name+' · '+r.n+' Q</span></td><td>'+s+'</td>'+
      '<td class="num">'+(sc?'<span class="net">'+fmt(sc.net)+'</span>':'')+'</td><td class="num hide-m">'+(sc?sc.right:'')+'</td><td class="num hide-m">'+(sc?sc.wrong:'')+'</td><td class="num hide-m">'+(sc?sc.skip:'')+'</td><td class="num hide-m">'+(sc&&sc.when?day(sc.when):'')+'</td></tr>'});
  return h+'</tbody></table></div>';
};

V.search=function(q){
  var w=q.toLowerCase().split(/\s+/).filter(Boolean);
  function hit(s){s=s.toLowerCase(); return w.every(function(x){return s.indexOf(x)>-1})}
  var pages=R.filter(function(r){var S=subById(subOf(r)); return hit(r.t+" "+r.y+" "+r.s+" "+(r.x||"")+" "+(r.g||"")+" "+(S?S.name+" "+S.short:"")+(r.s==="mock"?" test mock":r.s==="pyq"?" past paper pyq":""))});
  var topics=[]; SYL.forEach(function(S){S.topics.forEach(function(t){ if(hit(t.n+" "+S.name+" "+(t.tags||[]).join(" "))) topics.push([S,t]) })});
  var h=ph("Search",'“'+esc(q)+'”');
  if(!pages.length&&!topics.length) return h+'<p class="note">Nothing matches.</p>';
  if(pages.length) h+=sec("Pages",pages.length)+'<div class="panel rows">'+rows(pages,true)+'</div>';
  if(topics.length) h+=sec("Topics",topics.length)+'<div class="panel rows">'+topics.map(function(x){return '<a class="row" href="#/s/'+x[0].id+'"><span class="t">'+esc(x[1].n)+'</span><span class="lead"></span><span class="r"><span class="m">'+x[0].name+'</span></span></a>'}).join("")+'</div>';
  return h;
};

var cur="home", ALIAS={"":"home",dashboard:"home",mocks:"tests"};
function route(){
  var h=location.hash.replace(/^#\/?/,""), view=$("#view"), q=$("#q").value.trim();
  var parts=h.split("?"), name=parts[0], params=new URLSearchParams(parts[1]||"");
  if(ALIAS[name]!==undefined) name=ALIAS[name];
  var isOpen=name==="open";
  $("#bar").classList.toggle("viewing",isOpen); $("#back").classList.toggle("hidden",!isOpen); $("#full").classList.toggle("hidden",!isOpen);
  $("#days").classList.toggle("hidden",isOpen);
  if(isOpen){
    var f=params.get("f")||"", t=params.get("t")||titleOf(f);
    if(!/^[\w\-./#]+$/.test(f)||/^\/\/|:/.test(f)){location.hash="#/home";return}
    $("#title").textContent=t; $("#full").href=f; view.className="view frame";
    if(!view.querySelector("iframe")||view.dataset.f!==f){view.innerHTML='<iframe title="'+esc(t)+'" src="'+esc(f)+'"></iframe>'; view.dataset.f=f;
      /* give the opened page the keyboard, so its shortcuts and arrow keys work straight away */
      var fr=view.querySelector("iframe"); fr.addEventListener("load",function(){ try{ fr.focus(); fr.contentWindow.focus() }catch(e){} })}
    mark(cur);
    var side=$$("#sidenav .ni").filter(function(a){return a.getAttribute("href")===location.hash});
    if(side.length){$$("#sidenav .ni").forEach(function(a){a.removeAttribute("aria-current")}); side[0].setAttribute("aria-current","page")}
    return;
  }
  view.className="view"; view.dataset.f="";
  var S=/^s\//.test(name)?subById(name.slice(2)):null;
  if(!S&&!V[name]) name="home";
  cur=name; mark(name); secN=0;
  $("#title").innerHTML=q?"Search":S?'<span class="bc">Subjects <i>›</i> </span>'+S.name:NAMES[name];
  view.innerHTML='<div class="wrap">'+(q?V.search(q):S?subjectView(S):V[name]())+'</div>';
  view.scrollTop=0;
}
/* While a page is open in the frame, keys pressed on the hub itself go to that page
   (so Revise can be answered with the keyboard without clicking into it first). */
document.addEventListener("keydown",function(e){
  var fr=document.querySelector(".view.frame iframe"), t=e.target;
  if(!fr||e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(t.tagName)) return;
  try{
    var w=fr.contentWindow; fr.focus(); w.focus();
    var ev=new w.KeyboardEvent("keydown",{key:e.key,code:e.code,shiftKey:e.shiftKey,bubbles:true,cancelable:true});
    (w.document.activeElement||w.document.body).dispatchEvent(ev);
    if(ev.defaultPrevented) e.preventDefault();
  }catch(err){}
});
function render(){ if(!/^#\/?open/.test(location.hash)){var y=$("#view").scrollTop; route(); $("#view").scrollTop=y} }
function mark(n){
  var tab=(/^s\//.test(n)||n==="syllabus")?"subjects":n;
  $$("[data-v]").forEach(function(a){var on=a.dataset.v===n||(a.parentNode.id==="tabs"&&a.dataset.v===tab);
    if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current")});
}
window.addEventListener("hashchange",route);
$("#back").addEventListener("click",function(){ if(history.length>1) history.back(); else location.hash="#/"+cur });
$("#q").addEventListener("input",function(){ if(/^#\/?open/.test(location.hash)) location.hash="#/"+cur; else route() });
$("#sbtn").addEventListener("click",function(){var b=$("#bar"); b.classList.toggle("searching"); if(b.classList.contains("searching")) $("#q").focus(); else {$("#q").value=""; route()}});

/* clicks: table rows, chart points, sort and filter buttons */
document.addEventListener("click",function(e){
  var s=e.target.closest("[data-sort]"); if(s){var k=s.dataset.sort; if(k==="order"){sortKey="order";sortDir=1} else if(sortKey===k) sortDir=-sortDir; else {sortKey=k; sortDir=k==="title"?1:-1} render(); return}
  var f=e.target.closest("[data-tf]"); if(f){testFilter=f.dataset.tf; render(); return}
  var t=e.target.closest("[data-ts]"); if(t){topicSort=t.dataset.ts; render(); return}
  if(e.target.closest("a")&&$("#q").value){ $("#q").value=""; $("#bar").classList.remove("searching"); if(e.target.closest("a").getAttribute("href")==="#/"+cur) route() }
  var row=e.target.closest("[data-href]"); if(row&&!e.target.closest("a")){ $("#q").value=""; $("#bar").classList.remove("searching"); if(location.hash===row.dataset.href) route(); else location.hash=row.dataset.href; return}
});
document.addEventListener("pointerover",function(e){var h=e.target.closest(".hit"); if(!h) return; var c=h.closest(".chart"),tip=$(".tip",c),b=c.getBoundingClientRect(),r=h.getBoundingClientRect();
  tip.textContent=h.dataset.tip.replace(/&#10;/g,"\n"); tip.style.left=(r.left+r.width/2-b.left)+"px"; tip.style.top=(r.top+r.height/2-b.top)+"px"; tip.style.display="block"});
document.addEventListener("pointerout",function(e){var h=e.target.closest(".hit"); if(h) $(".tip",h.closest(".chart")).style.display="none"});

/* live updates: a test finished inside the app writes localStorage -> rescore */
var rt; function soon(){clearTimeout(rt); rt=setTimeout(refreshScores,400)}
window.addEventListener("storage",soon);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible") soon()});
window.addEventListener("hashchange",function(){ if(!/^#\/?open/.test(location.hash)) soon() });

route(); refreshScores();

/* offline */
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").then(function(){$("#saveall").hidden=false}).catch(function(){});
  $("#saveall").addEventListener("click",function(){
    var list=R.map(function(r){return r.f}),ok=0,b=this,n=list.length; b.disabled=true;
    (function step(){ if(!list.length){$("#savemsg").textContent="Saved "+ok+" pages"; b.disabled=false; return}
      fetch(list.shift(),{cache:"reload"}).then(function(r){if(r.ok) ok++}).catch(function(){}).then(function(){$("#savemsg").textContent="Saving "+ok+"/"+n; step()}) })();
  });
}
</script>
