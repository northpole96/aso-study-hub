<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASO Vocabulary Test</title>
<style>
:root{--bg:#f3e8cc;--card:#fffaf0;--ink:#18542a;--muted:#6b6a52;--line:#d9c9a0;--accent:#d52518;--soft:#fbe6dc;--ok:#1f7a4d;--oks:#e3f2e8;--bad:#b3261e;--bads:#fbeaea;--syn:#f96015}
@media (prefers-color-scheme:dark){:root{--bg:#1a1a14;--card:#23231a;--ink:#a8e0b5;--muted:#a3a29b;--line:#3d3d2e;--accent:#ff7a6b;--soft:#3a2420;--ok:#5fc795;--oks:#1a2a22;--bad:#ff8a80;--bads:#3a1d1b;--syn:#ffa05a}}
*{box-sizing:border-box}html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "SF Mono",Menlo,Consolas,monospace}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
.btn{font:600 15px/1 inherit;padding:12px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.prog{height:6px;background:var(--line);border-radius:9px;margin:8px 0 14px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}
.sec{font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 9px;border-radius:99px}
.q{font-size:19px;margin:12px 0;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:16px/1.5 inherit;padding:11px 12px;margin:7px 0;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--accent)}.opt b{flex:none;width:22px}
.opt.right{border-color:var(--ok);background:var(--oks)}.opt.wrong{border-color:var(--bad);background:var(--bads)}
.exp{border-left:4px solid var(--syn);padding:8px 12px;margin-top:10px;border-radius:6px;background:var(--soft);overflow-wrap:anywhere}
.hide{display:none}.big{font-size:40px;font-weight:800;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 12px}.stat b{display:block;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.rq{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
</style></head>
<body><div class="wrap">
<h1>ASO Vocabulary Test</h1>
<p class="sub">65 MCQs made from ASO-Vocabulary.html (13 words). Pick an answer to see the explanation at once. Marking: +1 right, &minus;0.25 wrong.</p>

<div id="intro" class="card">
<p>Five kinds of questions on every word: word to meaning, meaning to word, synonym, odd one out, fill in the blank.</p>
<div class="row"><button class="btn primary" id="start">Start test</button></div>
</div>

</div>

<div id="result" class="card hide">
<div class="big" id="score"></div><div class="stats" id="stats"></div>
<table id="secT"></table>

<div id="review"></div>
</div>
</div>

nt, brief, momentary, ephemeral, short-lived."}, {"s": "Word \u2192 Meaning", "q": "\"Fleeting\" means:", "opts": ["Full of energy and enthusiasm for a cause", "Logical, clear and well organised, so the parts fit together", "Passing quickly, lasting only a moment", "Clear and easy to understand"], "ans": 2, "exp": "Fleeting = passing quickly, lasting only a moment. Synonyms: transient, brief, momentary, ephemeral, short-lived."}, {"s": "Synonym", "q": "Choose the synonym of \"Zealous\":", "opts": ["transient", "ardent", "blunt", "transparent"], "ans": 1, "exp": "Zealous (full of energy and enthusiasm for a cause) has synonyms: eager, passionate, keen, ardent."}, {"s": "Fill in the blank", "q": "We caught only a ___ glimpse of the train as it sped past.", "opts": ["Benevolent", "Fleeting", "Lucid", "Meticulous"], "ans": 1, "exp": "Fleeting = passing quickly, lasting only a moment. It fits the sentence."}, {"s": "Meaning \u2192 Word", "q": "Which word means \"lasting a very short time\"?", "opts": ["Ephemeral", "Candid", "Prudent", "Meticulous"], "ans": 0, "exp": "Ephemeral = lasting a very short time."}, {"s": "Synonym", "q": "Choose the synonym of \"Reticent\":", "opts": ["sincere", "understandable", "shy", "frank"], "ans": 2, "exp": "Reticent (quiet, not willing to speak much) has synonyms: reserved, silent, shy, uncommunicative."}, {"s": "Odd one out", "q": "Which is NOT a synonym of \"Benevolent\"?", "opts": ["charitable", "kind", "sincere", "caring"], "ans": 2, "exp": "\"sincere\" belongs to another word. The synonyms of Benevolent are kind, generous, charitable, caring."}, {"s": "Odd one out", "q": "Which is NOT a synonym of \"Candid\"?", "opts": ["open", "kind", "blunt", "frank"], "ans": 1, "exp": "\"kind\" belongs to another word. The synonyms of Candid are frank, open, blunt, sincere."}, {"s": "Synonym", "q": "Choose the synonym of \"Intelligible\":", "opts": ["shy", "short-lived", "brief", "comprehensible"], "ans": 3, "exp": "Intelligible (able to be understood) has synonyms: understandable, clear, comprehensible, lucid."}, {"s": "Meaning \u2192 Word", "q": "Which word means \"quiet, not willing to speak much\"?", "opts": ["Meticulous", "Intelligible", "Ardent", "Reticent"], "ans": 3, "exp": "Reticent = quiet, not willing to speak much."}, {"s": "Meaning \u2192 Word", "q": "Which word means \"logical, clear and well organised, so the parts fit together\"?", "opts": ["Transient", "Benevolent", "Coherent", "Ephemeral"], "ans": 2, "exp": "Coherent = logical, clear and well organised, so the parts fit together."}, {"s": "Odd one out", "q": "Which is NOT a synonym of \"Lucid\"?", "opts": ["transparent", "shy", "clear", "intelligible"], "ans": 1, "exp": "\"shy\" belongs to another word. The synonyms of Lucid are clear, plain, intelligible, transparent."}, {"s": "Synonym", "q": "Choose the synonym of \"Transient\":", "opts": ["careful", "zealous", "ardent", "short-lived"], "ans": 3, "exp": "Transient (lasting a short time) has synonyms: temporary, brief, fleeting, short-lived."}, {"s": "Meaning \u2192 Word", "q": "Which word means \"clear and easy to understand\"?", "opts": ["Lucid", "Prudent", "Zealous", "Candid"], "ans": 0, "exp": "Lucid = clear and easy to understand."}, {"s": "Word \u2192 Meaning", "q": "\"Ephemeral\" means:", "opts": ["Kind and helpful to others", "Lasting a very short time", "Very careful about small details", "Very enthusiastic and passionate"], "ans": 1, "exp": "Ephemeral = lasting a very short time. Synonyms: fleeting, short-lived, momentary, transient."}, {"s": "Fill in the blank", "q": "The beauty of the morning dew is ___; it vanishes by sunrise.", "opts": ["Meticulous", "Ephemeral", "Ardent", "Coherent"], "ans": 1, "exp": "Ephemeral = lasting a very short time. It fits the sentence."}, {"s": "Word \u2192 Meaning", "q": "\"Ardent\" means:", "opts": ["Very enthusiastic and passionate", "Logical, clear and well organised, so the parts fit together", "Passing quickly, lasting only a moment", "Lasting a short time"], "ans": 0, "exp": "Ardent = very enthusiastic and passionate. Synonyms: passionate, eager, keen, fervent, zealous."}, {"s": "Fill in the blank", "q": "He is ___ in meetings and rarely shares his views.", "opts": ["Intelligible", "Candid", "Meticulous", "Reticent"], "ans": 3, "exp": "Reticent = quiet, not willing to speak much. It fits the sentence."}, {"s": "Word \u2192 Meaning", "q": "\"Prudent\" means:", "opts": ["Very enthusiastic and passionate", "Full of energy and enthusiasm for a cause", "Passing quickly, lasting only a moment", "Careful and wise"], "ans": 3, "exp": "Prudent = careful and wise. Synonyms: wise, cautious, sensible, judicious."}, {"s": "Fill in the blank", "q": "The ___ volunteers worked day and night for the cause.", "opts": ["Fleeting", "Benevolent", "Reticent", "Zealous"], "ans": 3, "exp": "Zealous = full of energy and enthusiasm for a cause. It fits the sentence."}, {"s": "Meaning \u2192 Word", "q": "Which word means \"able to be understood\"?", "opts": ["Ardent", "Meticulous", "Fleeting", "Intelligible"], "ans": 3, "exp": "Intelligible = able to be understood."}, {"s": "Fill in the blank", "q": "The hotel guests were ___ and stayed only a night or two.", "opts": ["Transient", "Ardent", "Meticulous", "Benevolent"], "ans": 0, "exp": "Transient = lasting a short time. It fits the sentence."}, {"s": "Word \u2192 Meaning", "q": "\"Intelligible\" means:", "opts": ["Able to be understood", "Very enthusiastic and passionate", "Quiet, not willing to speak much", "Honest and straightforward"], "ans": 0, "exp": "Intelligible = able to be understood. Synonyms: understandable, clear, comprehensible, lucid."}, {"s": "Word \u2192 Meaning", "q": "\"Benevolent\" means:", "opts": ["Careful and wise", "Very careful about small details", "Very enthusiastic and passionate", "Kind and helpful to others"], "ans": 3, "exp": "Benevolent = kind and helpful to others. Synonyms: kind, generous, charitable, caring."}, {"s": "Odd one out", "q": "Which is NOT a synonym of \"Coherent\"?", "opts": ["wise", "rational", "consistent", "clear"], "ans": 0, "exp": "\"wise\" belongs to another word. The synonyms of Coherent are logical, consistent, clear, rational, organised."}, {"s": "Meaning \u2192 Word", "q": "Which word means \"full of energy and enthusiasm for a cause\"?", "opts": ["Candid", "Fleeting", "Zealous", "Transient"], "ans": 2, "exp": "Zealous = full of energy and enthusiasm for a cause."}, {"s": "Synonym", "q": "Choose the synonym of \"Coherent\":", "opts": ["short-lived", "shy", "silent", "logical"], "ans": 3, "exp": "Coherent (logical, clear and well organised, so the parts fit together) has synonyms: logical, consistent, clear, rational, organised."}, {"s": "Synonym", "q": "Choose the synonym of \"Candid\":", "opts": ["blunt", "zealous", "consistent", "kind"], "ans": 0, "exp": "Candid (honest and straightforward) has synonyms: frank, open, blunt, sincere."}, {"s": "Meaning \u2192 Word", "q": "Which word means \"kind and helpful to others\"?", "opts": ["Benevolent", "Fleeting", "Ardent", "Intelligible"], "ans": 0, "exp": "Benevolent = kind and helpful to others."}, {"s": "Word \u2192 Meaning", "q": "\"Coherent\" means:", "opts": ["Full of energy and enthusiasm for a cause", "Honest and straightforward", "Logical, clear and well organised, so the parts fit together", "Kind and helpful to others"], "ans": 2, "exp": "Coherent = logical, clear and well organised, so the parts fit together. Synonyms: logical, consistent, clear, rational, organised."}, {"s": "Synonym", "q": "Choose the synonym of \"Ardent\":", "opts": ["keen", "momentary", "blunt", "painstaking"], "ans": 0, "exp": "Ardent (very enthusiastic and passionate) has synonyms: passionate, eager, keen, fervent, zealous."}, {"s": "Word \u2192 Meaning", "q": "\"Meticulous\" means:", "opts": ["Passing quickly, lasting only a moment", "Very careful about small details", "Honest and straightforward", "Quiet, not willing to speak much"], "ans": 1, "exp": "Meticulous = very careful about small details. Synonyms: careful, thorough, precise, painstaking."}, {"s": "Fill in the blank", "q": "She is an ___ supporter of the team and never misses a match.", "opts": ["Ardent", "Meticulous", "Ephemeral", "Intelligible"], "ans": 0, "exp": "Ardent = very enthusiastic and passionate. It fits the sentence."}, {"s": "Meaning \u2192 Word", "q": "Which word means \"very enthusiastic and passionate\"?", "opts": ["Coherent", "Ephemeral", "Meticulous", "Ardent"], "ans": 3, "exp": "Ardent = very enthusiastic and passionate."}, {"s": "Word \u2192 Meaning", "q": "\"Zealous\" means:", "opts": ["Lasting a very short time", "Kind and helpful to others", "Full of energy and enthusiasm for a cause", "Lasting a short time"], "ans": 2, "exp": "Zealous = full of energy and enthusiasm for a cause. Synonyms: eager, passionate, keen, ardent."}, {"s": "Meaning \u2192 Word", "q": "Which word means \"passing quickly, lasting only a moment\"?", "opts": ["Fleeting", "Intelligible", "Benevolent", "Prudent"], "ans": 0, "exp": "Fleeting = passing quickly, lasting only a moment."}, {"s": "Fill in the blank", "q": "His handwriting was barely ___, so nobody could read the note.", "opts": ["Ardent", "Intelligible", "Candid", "Reticent"], "ans": 1, "exp": "Intelligible = able to be understood. It fits the sentence."}, {"s": "Synonym", "q": "Choose the synonym of \"Ephemeral\":", "opts": ["understandable", "thorough", "lucid", "transient"], "ans": 3, "exp": "Ephemeral (lasting a very short time) has synonyms: fleeting, short-lived, momentary, transient."}, {"s": "Word \u2192 Meaning", "q": "\"Reticent\" means:", "opts": ["Able to be understood", "Full of energy and enthusiasm for a cause", "Honest and straightforward", "Quiet, not willing to speak much"], "ans": 3, "exp": "Reticent = quiet, not willing to speak much. Synonyms: reserved, silent, shy, uncommunicative."}, {"s": "Synonym", "q": "Choose the synonym of \"Meticulous\":", "opts": ["eager", "uncommunicative", function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
